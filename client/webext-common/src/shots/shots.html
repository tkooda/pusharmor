<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>PushArmor screenshots</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="style.css">
<style>
  html, body { margin: 0; width: 1280px; height: 800px; max-height: none; overflow: hidden; color-scheme: light; }
  body { padding: 0; background: #1F3A5F; display: flex; flex-direction: column; align-items: center; }
  .side { box-sizing: border-box; width: 100%; height: 96px; flex: none; padding: 0 40px; display: flex; align-items: center; justify-content: space-between; gap: 32px; color: #FFFFFF; font: 20px system-ui, sans-serif; }
  .side h1 { margin: 0; color: #FFFFFF; font-size: 44px; line-height: 1.1; letter-spacing: -1px; white-space: nowrap; }
  .side h1 .push { color: #34C77B; }
  .side p { margin: 0; font-size: 26px; line-height: 1.25; text-align: right; }
  /* the popup size (400x560, as in style.css); shots.ts sets the zoom so it fills the area under the band */
  .frame { zoom: 1; width: 400px; height: 560px; overflow: hidden; background: var(--bg); border-radius: 8px; box-shadow: 0 12px 40px rgba(0, 0, 0, 0.45); }
  html.bare, html.bare body { width: 400px; height: auto; background: #808890; display: block; }
  html.bare body { color-scheme: inherit; }
  html.bare .side { display: none; }
  html.bare .frame { zoom: 1; border-radius: 0; box-shadow: none; }
</style>
</head>
<body>
<div class="side"><h1><span class="push">Push</span>Armor</h1><p id="headline"></p></div>
<div class="frame"><div id="app"></div></div>
<script type="module" src="shots.js"></script>
</body>
</html>
