[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pusharmor"
dynamic = ["version"]
description = "PushArmor command-line client"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
dependencies = ["cryptography>=3.3.2"]

[project.urls]
Homepage = "https://pusharmor.com"

[project.scripts]
pusharmor = "pusharmor:main"

[tool.setuptools]
py-modules = ["pusharmor"]

[tool.setuptools.dynamic]
version = { attr = "pusharmor.VERSION" }
