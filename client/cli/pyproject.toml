[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pusharmor"
version = "0.0.0"
description = "PushArmor command-line client"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"

[project.urls]
Homepage = "https://pusharmor.com"

[project.scripts]
pusharmor = "pusharmor:main"

[tool.setuptools]
py-modules = ["pusharmor"]
