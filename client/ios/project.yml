# XcodeGen spec: `xcodegen generate` writes PushArmor.xcodeproj (not committed).
name: PushArmor
options:
  bundleIdPrefix: com.pusharmor
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
# Build ids (DEVELOPMENT_TEAM, GOOGLE_IOS_CLIENT_ID, GOOGLE_CALLBACK_SCHEME) come from
# Config/Public.xcconfig (git-ignored), written by tools/public-xcconfig.sh from release/public.json.
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "0.0.2"
    CURRENT_PROJECT_VERSION: "2"
    APP_BUNDLE_ID: com.pusharmor.app            # repo constant after the store bootstrap
    CODE_SIGN_STYLE: Automatic
  configs:
    # Tests reach app code only through @testable import in Debug; Release is never testable.
    Release:
      ENABLE_TESTABILITY: NO
packages:
  PushArmorCore:
    path: PushArmorCore
targets:
  PushArmor:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
    dependencies:
      - package: PushArmorCore
      - target: PushArmorNSE
      - target: PushArmorShare
    preBuildScripts:
      # Release gate: the script exits 0 in every configuration except Release.
      - name: Check release values
        script: sh "${SRCROOT}/tools/check-release-values.sh"
        inputFiles:
          - $(SRCROOT)/App/PushArmor.entitlements   # declared so a sandboxed script phase may read it
        basedOnDependencyAnalysis: false
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: PushArmor
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: true   # end-to-end encryption (owner ruling Q216 A)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        PAAppGroup: group.$(APP_BUNDLE_ID)
        PAKeychainGroup: $(AppIdentifierPrefix)$(APP_BUNDLE_ID).shared
        PAGoogleClientID: $(GOOGLE_IOS_CLIENT_ID)
        CFBundleURLTypes:
          - CFBundleURLName: google-oauth
            CFBundleURLSchemes: [$(GOOGLE_CALLBACK_SCHEME)]
    entitlements:
      path: App/PushArmor.entitlements
      properties:
        aps-environment: $(APS_ENVIRONMENT)   # expanded per configuration at signing
        com.apple.security.application-groups: [group.$(APP_BUNDLE_ID)]
        keychain-access-groups: [$(AppIdentifierPrefix)$(APP_BUNDLE_ID).shared]
        com.apple.developer.applesignin: [Default]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Debug:
          APS_ENVIRONMENT: development
        Release:
          APS_ENVIRONMENT: production
  PushArmorNSE:
    type: app-extension
    platform: iOS
    sources:
      - NSE
      - Shared
    dependencies:
      - package: PushArmorCore
    info:
      path: NSE/Info.plist
      properties:
        CFBundleDisplayName: PushArmorNSE
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        PAAppGroup: group.$(APP_BUNDLE_ID)
        PAKeychainGroup: $(AppIdentifierPrefix)$(APP_BUNDLE_ID).shared
        PAGoogleClientID: ""
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
    entitlements:
      path: NSE/PushArmorNSE.entitlements
      properties:
        com.apple.security.application-groups: [group.$(APP_BUNDLE_ID)]
        keychain-access-groups: [$(AppIdentifierPrefix)$(APP_BUNDLE_ID).shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).nse
  PushArmorShare:
    type: app-extension
    platform: iOS
    sources:
      - Share
      - Shared
    dependencies:
      - package: PushArmorCore
    info:
      path: Share/Info.plist
      properties:
        CFBundleDisplayName: PushArmor
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        PAAppGroup: group.$(APP_BUNDLE_ID)
        PAKeychainGroup: $(AppIdentifierPrefix)$(APP_BUNDLE_ID).shared
        PAGoogleClientID: ""
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsText: true
    entitlements:
      path: Share/PushArmorShare.entitlements
      properties:
        com.apple.security.application-groups: [group.$(APP_BUNDLE_ID)]
        keychain-access-groups: [$(AppIdentifierPrefix)$(APP_BUNDLE_ID).shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).share
  # Tests: built and run only by the scheme's test action (Debug); never part of an archive.
  PushArmorTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - PushArmorTests
    dependencies:
      - target: PushArmor   # PushArmorCore symbols resolve through BUNDLE_LOADER (not linked twice)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/PushArmor.app/PushArmor
        BUNDLE_LOADER: $(TEST_HOST)
  PushArmorUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - PushArmorUITests
    dependencies:
      - target: PushArmor
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: PushArmor
schemes:
  PushArmor:
    build:
      targets:
        PushArmor: all
    test:
      config: Debug
      targets:
        - PushArmorTests
        - PushArmorUITests
