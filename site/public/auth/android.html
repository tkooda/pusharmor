<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Return to PushArmor</title>
<meta name="description" content="Returning to the PushArmor app after sign-in.">
<meta name="theme-color" content="#1F3A5F">
<meta property="og:type" content="website">
<meta property="og:site_name" content="PushArmor">
<meta property="og:title" content="Return to PushArmor">
<meta property="og:description" content="Returning to the PushArmor app after sign-in.">
<meta property="og:image" content="https://pusharmor.com/apple-touch-icon.png">
<link rel="icon" href="/favicon.ico" sizes="any" integrity="sha256-WBRVm+oTUTpG8HdmRjQYXSzTkCjwYCVj5PZdJQP73qM=">
<link rel="apple-touch-icon" href="/apple-touch-icon.png" integrity="sha256-TQcTrShS2zw2E6zqzKq9Tlfqd9GGyBSjl/LTQvTeJY8=">
<link rel="stylesheet" href="/css/site.css" integrity="sha256-J7Rd6Txm5YG82tBpkrGpyYFhZi0uAWUn5A+UcYaR2wQ=">
</head>
<body>
<main>
<h1>Sign-in done</h1>
<p><a id="return" class="button" href="intent://pusharmor.com/auth/android#Intent;scheme=https;package=com.pusharmor;S.browser_fallback_url=https%3A%2F%2Fpusharmor.com%2Fdownload;end">Tap to return to PushArmor</a></p>
<p><a href="/download">Do not have the app? Get PushArmor</a></p>
</main>
<footer>
<a href="/support">Support</a> <a href="https://github.com/tkooda/pusharmor">Source code on GitHub</a>
</footer>
<script>(function(){var h=location.hash.slice(1),a=document.getElementById("return");if(h&&/^[A-Za-z0-9._~%=&+@-]+$/.test(h)){a.href="intent://pusharmor.com/auth/android?"+h+"#Intent;scheme=https;package=com.pusharmor;S.browser_fallback_url=https%3A%2F%2Fpusharmor.com%2Fdownload;end";}history.replaceState(null,"",location.pathname);})();</script>
</body>
</html>
