name: ci

# The one entry workflow for pull requests and pushes to main. It decides which
# component files to call; ci-ok is the only required check. Release tags run
# the tag-only *-release.yml files, which call the same component files; every
# call from here grants contents: read and nothing more.
on:
  pull_request:
  merge_group:
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: change detection
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      worker: ${{ steps.detect.outputs.worker }}
      site: ${{ steps.detect.outputs.site }}
      webext: ${{ steps.detect.outputs.webext }}
      android: ${{ steps.detect.outputs.android }}
      ios: ${{ steps.detect.outputs.ios }}
      cli: ${{ steps.detect.outputs.cli }}
      vectors: ${{ steps.detect.outputs.vectors }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: detect
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # pull_request: HEAD is the merge commit, so HEAD^1..HEAD is the PR change.
          # push: base..HEAD, where base is the head of the newest successful ci push
          # run on main. A newer push cancels a queued run, so before..HEAD alone
          # would skip the cancelled commits. If that lookup fails or base is not an
          # earlier commit, before..HEAD; a new branch or an unknown before runs everything.
          all=0
          base=""
          if [ "$EVENT" = "push" ]; then
            # the jq reads the runs array without naming it: repo.yml bans that word in .github/
            base="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?branch=main&event=push&status=success&per_page=1" \
              --jq 'first(.[] | arrays | .[0].head_sha) // empty' 2>/dev/null)" || base=""
            if ! printf '%s' "$base" | grep -Eq '^[0-9a-f]{40}$' || [ "$base" = "$(git rev-parse HEAD)" ] \
              || ! git merge-base --is-ancestor "$base" HEAD 2>/dev/null; then
              base=""
            fi
            echo "last successful ci push run: ${base:-none}"
          fi
          if [ "$EVENT" = "pull_request" ]; then
            files="$(git diff --name-only HEAD^1 HEAD)"
          elif [ -n "$base" ]; then
            files="$(git diff --name-only "$base" HEAD)"
          elif printf '%s' "$BEFORE" | grep -Eq '^[0-9a-f]{40}$' && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] \
            && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            files="$(git diff --name-only "$BEFORE" HEAD)"
          else
            files=""
            all=1
          fi
          printf '%s\n' "$files"
          hit() { [ "$all" = 1 ] || printf '%s\n' "$files" | grep -Eq "$1"; }
          # Strict shared paths (workflows, release values, vectors, node pins) count as
          # every component. The npm lockfile and .npmrc reach only the npm-based
          # components, not the Android or iOS builds.
          if hit '^(\.github/|release/|tests/vectors/|\.node-version$|site/\.node-version$)'; then all=1; fi
          npmall=0
          if [ "$all" = 0 ] && printf '%s\n' "$files" | grep -Eq '^(package-lock\.json|\.npmrc)$'; then npmall=1; fi
          out() { if [ "$npmall" = 1 ] || hit "$2"; then echo "$1=true"; else echo "$1=false"; fi >> "$GITHUB_OUTPUT"; }
          outn() { if hit "$2"; then echo "$1=true"; else echo "$1=false"; fi >> "$GITHUB_OUTPUT"; }
          out worker '^server/(worker|tools|deploy)/'
          # the site checks also read the Firefox manifest and the Worker wrangler pin
          out site '^(site/|client/firefox/|server/worker/package\.json$)'
          out webext '^client/(webext-common|chrome|firefox)/'
          outn android '^client/android/'
          outn ios '^client/ios/'
          out cli '^client/cli/'
          out vectors '^(server/worker|client/(webext-common|chrome|firefox|android|ios))/'
          cat "$GITHUB_OUTPUT"

  repo:
    permissions:
      contents: read
    uses: ./.github/workflows/repo.yml

  vectors:
    needs: changes
    if: needs.changes.outputs.vectors == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/vectors.yml

  worker:
    needs: changes
    if: needs.changes.outputs.worker == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/worker.yml

  site:
    needs: changes
    if: needs.changes.outputs.site == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/site.yml

  webext:
    needs: changes
    if: needs.changes.outputs.webext == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/webext.yml

  android:
    needs: changes
    if: needs.changes.outputs.android == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/android.yml

  # Not in ci-ok needs on purpose: the emulator tests have not run yet, and it is
  # not documented whether a failed continue-on-error job inside a called workflow
  # fails the caller job. The flip (owner ruling Q197 B) after the first green run
  # on main: remove continue-on-error in android-emulator.yml and add
  # android-emulator to the ci-ok needs below.
  android-emulator:
    needs: changes
    if: needs.changes.outputs.android == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/android-emulator.yml

  ios:
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/ios.yml

  cli:
    needs: changes
    if: needs.changes.outputs.cli == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/cli.yml

  ci-ok:
    name: ci-ok
    if: always()
    needs: [changes, repo, vectors, worker, site, webext, android, ios, cli]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Every job that ran passed (a skipped job is fine)
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for r in $RESULTS; do
            case "$r" in
              success|skipped) ;;
              *) echo "a needed job ended with: $r"; exit 1 ;;
            esac
          done
