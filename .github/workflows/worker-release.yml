name: worker-release

# worker/vX.Y.Z tags only (release/tag.mjs): the tag rule, the golden vectors
# and worker.yml. Build and test only; CI never deploys the Worker. The owner
# then runs server/deploy/deploy.sh worker/vX.Y.Z from a clean checkout of the
# tag (RELEASING.md).
on:
  push:
    tags:
      - "worker/v*"

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Fails early: the tag rule, version files and ci-ok before any test.
  tag:
    name: release tag rule and version files
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: site/.node-version
      - name: Release tag rule
        run: node release/tag.mjs --check "$TAG"
      # Owner ruling Q215 C: ci-ok green on the tag commit; waits up to 40 minutes
      # for a running ci workflow.
      - name: ci-ok green on the tag commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: node release/tag.mjs --ci "$TAG"

  vectors:
    needs: tag
    permissions:
      contents: read
    uses: ./.github/workflows/vectors.yml

  test:
    needs: tag
    permissions:
      contents: read
    uses: ./.github/workflows/worker.yml
