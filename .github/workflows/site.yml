name: site

# Site checks only (also workflow_dispatch by hand). Cloudflare Workers Builds deploys site/ from main.
on:
  workflow_call:
  workflow_dispatch:

permissions: {}

jobs:
  test:
    name: hashes, site checks, build with CI dummies
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: site/.node-version
      - name: Install (pinned wrangler for the header snapshot)
        working-directory: site
        run: npm ci --ignore-scripts
      - name: SRI and CSP hashes are current
        run: node site/tools/hashes.mjs --check
      - name: Site checks
        run: node --test 'site/tools/test/*.test.mjs'
      # Proves the release build fills every id into the gitignored site/dist and
      # leaves the tree clean. Built with CI dummies, so the output is thrown away
      # (never uploaded).
      - name: Release build with CI dummies leaves the tree clean
        run: |
          cp release/public.json "$RUNNER_TEMP/public.json"
          node release/ci-dummy.mjs "$RUNNER_TEMP/public.json"
          PA_CI_DUMMY=1 node site/tools/build.mjs --public "$RUNNER_TEMP/public.json"
          test -z "$(git status --porcelain)" || { git status --porcelain; exit 1; }
