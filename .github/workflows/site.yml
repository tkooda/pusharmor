name: site

# Site checks only (also workflow_dispatch by hand). Cloudflare Workers Builds deploys site/ from main.
on:
  workflow_call:
  workflow_dispatch:

permissions: {}

jobs:
  test:
    name: hashes, site checks, build with CI dummies
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: site/.node-version
      - name: Install (pinned wrangler for the header snapshot)
        working-directory: site
        run: npm ci --ignore-scripts
      - name: SRI and CSP hashes are current
        run: node site/tools/hashes.mjs --check
      - name: Site checks
        run: node --test 'site/tools/test/*.test.mjs'
      # Proves the release build fills every id. Built with CI dummies, so the
      # output is thrown away (never uploaded).
      - name: Release build of a copy with CI dummies
        run: |
          node release/ci-dummy.mjs
          cp -R site/public "$RUNNER_TEMP/site"
          PA_CI_DUMMY=1 node site/tools/build.mjs --dir "$RUNNER_TEMP/site"
