name: ios-release

# ios/vX.Y.Z tags only (release/tag.mjs). The golden vectors and ios.yml (including the iOS 17 job)
# run first. Then three jobs; third-party code (SwiftPM packages, setup-node)
# runs only in build-ios, which holds no Environment, secret or id-token:
#   build-ios    resolve packages, archive (ad-hoc signed), upload the archive
#                and its SHA-256
#   sign-ios     Environment ios-release: verify the archive SHA-256, export
#                and check the IPA with cloud-managed signing, upload the IPA,
#                then the App Store Connect upload. No package resolution, no
#                npm, no node.
#   publish-ios  Environment ios-release, id-token: verify the IPA SHA-256,
#                provenance, GitHub prerelease. No third-party code.
# Test channels only (owner ruling Q209 B): TestFlight (no review submission)
# and the GitHub prerelease. The owner submits the build for App Store review
# with manual release and clears the prerelease flag by hand (RELEASING.md).
#
# Signing (owner ruling Q192 B): no certificate, profile or keychain is stored.
# xcodebuild -exportArchive re-signs the ad-hoc signed archive through App Store
# Connect with the API key. The key must be a
# TEAM key with the Admin role (cloud-managed distribution certificates need it;
# an App Manager key fails). A run may create a "Created via API" distribution
# certificate in the team when none exists.
on:
  push:
    tags:
      - "ios/v*"

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  XCODE_APP: /Applications/Xcode_26.6.app
  XCODE_VERSION: "Xcode 26.6"
  XCODE_BUILD: "Build version 17F113"
  XCODEGEN_VERSION: 2.46.0
  XCODEGEN_SHA256: 4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806
  APP_BUNDLE_ID: com.pusharmor.app

jobs:
  # Fails early: the tag rule and version files before any test or build.
  tag:
    name: release tag rule and version files
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: site/.node-version
      - name: Release tag rule
        run: node release/tag.mjs --check "$TAG"

  vectors:
    needs: tag
    permissions:
      contents: read
    uses: ./.github/workflows/vectors.yml

  test:
    needs: tag
    permissions:
      contents: read
    uses: ./.github/workflows/ios.yml
    with:
      oldest: true

  build-ios:
    name: build iOS (resolve packages, archive; no secrets)
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/ios/v')
    needs: [vectors, test]
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      TAG: ${{ github.ref_name }}
    outputs:
      version: ${{ steps.tag.outputs.version }}
      build: ${{ steps.tag.outputs.build }}
      team: ${{ steps.tag.outputs.team }}
      archive_sha256: ${{ steps.files.outputs.archive_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: site/.node-version
      - name: Select and assert Xcode
        run: |
          echo "runner image: $ImageOS $ImageVersion"
          sudo xcode-select -s "$XCODE_APP"
          v="$(xcodebuild -version)"
          echo "$v"
          printf '%s\n' "$v" | grep -qx "$XCODE_VERSION"
          printf '%s\n' "$v" | grep -qx "$XCODE_BUILD"
      - name: Release tag rule, version files and release values
        id: tag
        run: |
          version="$(node release/tag.mjs --check "$TAG")"
          IFS=. read -r major minor patch <<EOF
          $version
          EOF
          # PA_CI_DUMMY must be unset here; --check fails when it is set at all.
          node release/public.mjs --check apple_team_id google_ios_client_id
          team="$(node -p 'require(process.argv[1]).apple_team_id' "$PWD/release/public.json")"
          {
            echo "version=$version"
            echo "build=$((major * 1000000 + minor * 1000 + patch))"
            echo "team=$team"
          } >> "$GITHUB_OUTPUT"
      - name: Config/Public.xcconfig from release/public.json
        run: sh client/ios/tools/public-xcconfig.sh
      - name: XcodeGen (pinned, SHA-256 checked) and generate the project
        run: |
          d="$RUNNER_TEMP/xcodegen"
          mkdir -p "$d"
          curl -fsSL -o "$d/xcodegen.zip" "https://github.com/yonaskolb/XcodeGen/releases/download/$XCODEGEN_VERSION/xcodegen.zip"
          echo "$XCODEGEN_SHA256  $d/xcodegen.zip" | shasum -a 256 -c -
          unzip -q "$d/xcodegen.zip" -d "$d"
          "$d/xcodegen/bin/xcodegen" --version | grep -qF "$XCODEGEN_VERSION"
          cd client/ios && "$d/xcodegen/bin/xcodegen" generate
      - name: Resolve packages to the committed pins
        working-directory: client/ios
        run: |
          s=PushArmor.xcodeproj/project.xcworkspace/xcshareddata/swiftpm
          mkdir -p "$s"
          cp PushArmorCore/Package.resolved "$s/Package.resolved"
          xcodebuild -resolvePackageDependencies -project PushArmor.xcodeproj -scheme PushArmor
          python3 -I -c '
          import json, sys
          pins = lambda p: sorted((x["identity"], x["state"].get("revision")) for x in json.load(open(p))["pins"])
          if pins(sys.argv[1]) != pins(sys.argv[2]):
              sys.exit("resolved packages differ from PushArmorCore/Package.resolved")
          ' PushArmorCore/Package.resolved "$s/Package.resolved"
      # No signing identity or API key here: ad-hoc signed, so the entitlements
      # are in the archive for sign-ios to re-sign with.
      - name: Archive (Release, ad-hoc signed)
        working-directory: client/ios
        env:
          VERSION: ${{ steps.tag.outputs.version }}
          BUILD: ${{ steps.tag.outputs.build }}
        run: >-
          xcodebuild archive -project PushArmor.xcodeproj -scheme PushArmor -configuration Release
          -destination "generic/platform=iOS" -archivePath "$RUNNER_TEMP/PushArmor.xcarchive"
          -disableAutomaticPackageResolution
          CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO PROVISIONING_PROFILE_SPECIFIER=
          MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="$BUILD"
      # No test hooks in a release build (owner rule Q194).
      - name: Release bundle check (archive)
        run: bash client/ios/tools/check-release-bundle.sh "$RUNNER_TEMP/PushArmor.xcarchive"
      - name: Archive tarball and SHA-256
        id: files
        run: |
          out="$RUNNER_TEMP/archive"
          mkdir -p "$out"
          tar -C "$RUNNER_TEMP" -czf "$out/PushArmor.xcarchive.tar.gz" PushArmor.xcarchive
          echo "archive_sha256=$(shasum -a 256 "$out/PushArmor.xcarchive.tar.gz" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-archive
          path: ${{ runner.temp }}/archive/
          retention-days: 30
          if-no-files-found: error

  sign-ios:
    name: sign iOS (export the IPA, App Store Connect upload)
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/ios/v')
    needs: build-ios
    runs-on: macos-26
    timeout-minutes: 60
    environment: ios-release
    # No OIDC token here, and no package resolution or Node.js tools.
    permissions:
      contents: read
    env:
      TAG: ${{ github.ref_name }}
      VERSION: ${{ needs.build-ios.outputs.version }}
      BUILD: ${{ needs.build-ios.outputs.build }}
      TEAM: ${{ needs.build-ios.outputs.team }}
    outputs:
      ipa_sha256: ${{ steps.files.outputs.ipa_sha256 }}
    steps:
      # Only the bash check script; nothing from the checkout is built.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: client/ios/tools
      - name: Select and assert Xcode
        run: |
          echo "runner image: $ImageOS $ImageVersion"
          sudo xcode-select -s "$XCODE_APP"
          v="$(xcodebuild -version)"
          echo "$v"
          printf '%s\n' "$v" | grep -qx "$XCODE_VERSION"
          printf '%s\n' "$v" | grep -qx "$XCODE_BUILD"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ios-archive
          path: ${{ runner.temp }}/archive
      - name: Verify the archive SHA-256 against the build job and unpack it
        env:
          ARCHIVE_SHA256: ${{ needs.build-ios.outputs.archive_sha256 }}
        run: |
          printf '%s  %s\n' "$ARCHIVE_SHA256" PushArmor.xcarchive.tar.gz > "$RUNNER_TEMP/expect.sha256"
          (cd "$RUNNER_TEMP/archive" && shasum -a 256 -c --strict "$RUNNER_TEMP/expect.sha256")
          tar -C "$RUNNER_TEMP" -xzf "$RUNNER_TEMP/archive/PushArmor.xcarchive.tar.gz"
          test -d "$RUNNER_TEMP/PushArmor.xcarchive"
      # No test hooks in a release build (owner rule Q194).
      - name: Release bundle check (archive)
        run: bash client/ios/tools/check-release-bundle.sh "$RUNNER_TEMP/PushArmor.xcarchive"
      - name: App Store Connect API key (RUNNER_TEMP, owner-only)
        env:
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
        run: |
          umask 077
          mkdir -p "$RUNNER_TEMP/asc"
          printf '%s\n' "$ASC_API_KEY_P8" > "$RUNNER_TEMP/asc/AuthKey_$ASC_API_KEY_ID.p8"
          grep -q 'BEGIN PRIVATE KEY' "$RUNNER_TEMP/asc/AuthKey_$ASC_API_KEY_ID.p8"
      - name: ExportOptions.plist (export and upload)
        run: |
          for dest in export upload; do
            f="$RUNNER_TEMP/ExportOptions-$dest.plist"
            plutil -create xml1 "$f"
            plutil -insert method -string app-store-connect "$f"
            plutil -insert signingStyle -string automatic "$f"
            plutil -insert teamID -string "$TEAM" "$f"
            plutil -insert destination -string "$dest" "$f"
            plutil -insert manageAppVersionAndBuildNumber -bool NO "$f"
            plutil -p "$f"
          done
      - name: Export the IPA
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
        run: >-
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/PushArmor.xcarchive"
          -exportOptionsPlist "$RUNNER_TEMP/ExportOptions-export.plist" -exportPath "$RUNNER_TEMP/export"
          -allowProvisioningUpdates
          -authenticationKeyPath "$RUNNER_TEMP/asc/AuthKey_$ASC_API_KEY_ID.p8"
          -authenticationKeyID "$ASC_API_KEY_ID" -authenticationKeyIssuerID "$ASC_API_ISSUER_ID"
      - name: Check the IPA (bundle check, version, entitlements)
        run: |
          ipa="$RUNNER_TEMP/export/PushArmor.ipa"
          bash client/ios/tools/check-release-bundle.sh "$ipa"
          x="$RUNNER_TEMP/ipa"
          rm -rf "$x"
          unzip -q "$ipa" -d "$x"
          app="$x/Payload/PushArmor.app"
          got="$(plutil -extract CFBundleShortVersionString raw -o - "$app/Info.plist") $(plutil -extract CFBundleVersion raw -o - "$app/Info.plist")"
          [ "$got" = "$VERSION $BUILD" ] || { echo "IPA version $got, want $VERSION $BUILD"; exit 1; }
          for b in "$app" "$app/PlugIns/PushArmorNSE.appex" "$app/PlugIns/PushArmorShare.appex"; do
            codesign --verify --strict "$b"
            codesign -d --entitlements - --xml "$b" > "$RUNNER_TEMP/ent.plist" 2>/dev/null
            aps=""
            [ "$b" = "$app" ] && aps=production
            python3 -I - "$RUNNER_TEMP/ent.plist" "$b" "$TEAM" "$APP_BUNDLE_ID" "$aps" <<'PY'
          import plistlib, sys
          path, name, team, bid, aps = sys.argv[1:6]
          e = plistlib.load(open(path, "rb"))
          bad = []
          if aps and e.get("aps-environment") != aps:
              bad.append("aps-environment is %r, want %r" % (e.get("aps-environment"), aps))
          if e.get("com.apple.security.application-groups") != ["group." + bid]:
              bad.append("app groups are %r" % e.get("com.apple.security.application-groups"))
          if e.get("keychain-access-groups") != [team + "." + bid + ".shared"]:
              bad.append("keychain groups are %r" % e.get("keychain-access-groups"))
          if e.get("com.apple.developer.team-identifier") != team:
              bad.append("team is %r, want %r" % (e.get("com.apple.developer.team-identifier"), team))
          if e.get("get-task-allow"):
              bad.append("get-task-allow is set")
          if bad:
              sys.exit(name + ":\n  - " + "\n  - ".join(bad))
          print("ok: " + name)
          PY
          done
      - name: Release files and SHA-256 lines
        id: files
        run: |
          out="$RUNNER_TEMP/release"
          mkdir -p "$out"
          cp "$RUNNER_TEMP/export/PushArmor.ipa" "$out/pusharmor-$VERSION.ipa"
          (cd "$out" && shasum -a 256 "pusharmor-$VERSION.ipa") > "$out/pusharmor-ios-$VERSION.hashes.txt"
          cat "$out/pusharmor-ios-$VERSION.hashes.txt"
          echo "ipa_sha256=$(shasum -a 256 "$out/pusharmor-$VERSION.ipa" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-ipa
          path: ${{ runner.temp }}/release/
          retention-days: 30
          if-no-files-found: error
      # Last step of this job: upload to App Store Connect (TestFlight) by a
      # second export with destination upload; publish-ios runs after it.
      # Fallback if that fails on a future Xcode:
      # xcrun altool --upload-app -f <ipa> -t ios --apiKey <id> --apiIssuer <issuer>
      # with API_PRIVATE_KEYS_DIR pointing at the .p8 directory. A failure after
      # the upload is fixed with a new patch tag.
      - name: Upload to App Store Connect
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
        run: >-
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/PushArmor.xcarchive"
          -exportOptionsPlist "$RUNNER_TEMP/ExportOptions-upload.plist" -exportPath "$RUNNER_TEMP/upload"
          -allowProvisioningUpdates
          -authenticationKeyPath "$RUNNER_TEMP/asc/AuthKey_$ASC_API_KEY_ID.p8"
          -authenticationKeyID "$ASC_API_KEY_ID" -authenticationKeyIssuerID "$ASC_API_ISSUER_ID"
      - name: Remove the API key and export options
        if: always()
        run: rm -rf "$RUNNER_TEMP/asc" "$RUNNER_TEMP"/ExportOptions-*.plist

  publish-ios:
    name: publish iOS (provenance, GitHub prerelease)
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/ios/v')
    needs: [build-ios, sign-ios]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: ios-release
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      TAG: ${{ github.ref_name }}
      VERSION: ${{ needs.build-ios.outputs.version }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ios-ipa
          path: ${{ runner.temp }}/release
      - name: Verify the IPA SHA-256 against the sign job
        id: files
        env:
          IPA_SHA256: ${{ needs.sign-ios.outputs.ipa_sha256 }}
        run: |
          out="$RUNNER_TEMP/release"
          ipa="pusharmor-$VERSION.ipa"
          printf '%s  %s\n' "$IPA_SHA256" "$ipa" > "$RUNNER_TEMP/expect.sha256"
          (cd "$out" && sha256sum -c --strict "$RUNNER_TEMP/expect.sha256")
          {
            echo "dir=$out"
            echo "ipa=$out/$ipa"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.files.outputs.ipa }}
      # A rerun of the same tag replaces the assets of the prerelease; a release
      # the owner has promoted (prerelease flag cleared) is never touched.
      - name: GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DIR: ${{ steps.files.outputs.dir }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            pre="$(gh release view "$TAG" --json isPrerelease,isDraft --jq '.isPrerelease or .isDraft')"
            if [ "$pre" != "true" ]; then
              echo "::error::Release $TAG is promoted (not a prerelease); refusing to change its assets"
              exit 1
            fi
            gh release upload "$TAG" --clobber "$DIR"/*
          else
            gh release create "$TAG" --prerelease --verify-tag --title "$TAG" \
              --notes "Test build: TestFlight and this prerelease. Promote by hand (RELEASING.md)." \
              "$DIR"/*
          fi
