name: android-emulator

# Android instrumented tests on emulators. Called by ci.yml only, as a job that
# ci-ok does not wait for (see the flip note there).
on:
  workflow_call:

permissions: {}

env:
  JAVA_VERSION: "17.0.20+8"

jobs:
  # Instrumented tests on emulators. These have not run yet: continue-on-error
  # until the first green run on main (owner ruling Q197 B); then flip to
  # required by removing continue-on-error. ci.yml does not run this file for
  # release tags.
  android-emulator:
    name: emulator API ${{ matrix.api }} ${{ matrix.flavor }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    continue-on-error: true
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        api: [31, 35]
        flavor: [play, foss]
        include:
          - flavor: play
            target: google_apis
            task: connectedPlayDebugAndroidTest
          - flavor: foss
            target: default
            task: connectedFossDebugAndroidTest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -e /dev/kvm || { echo "/dev/kvm is missing on this runner"; exit 1; }
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: ${{ !(github.event_name == 'push' && github.ref == 'refs/heads/main') }}
      - name: Instrumented tests
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.target }}
          arch: x86_64
          profile: pixel_6
          # pixel_6 defaults to a 6G data partition, which needs 7.2G free; some
          # runners have less, and the emulator exits before adb sees it.
          disk-size: 2G
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot-save -noaudio -no-boot-anim
          working-directory: client/android
          script: ./gradlew --no-daemon --stacktrace :app:${{ matrix.task }}
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-emulator-${{ matrix.api }}-${{ matrix.flavor }}
          path: client/android/app/build/outputs/androidTest-results/
          retention-days: 7
