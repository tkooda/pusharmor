name: cli-release

# cli/vX.Y.Z tags (release/tag.mjs): the tag rule and the release gate (cli.yml
# passed in ci) first, then jobs for the command-line client:
#   build           no secrets: sdist, wheel, pusharmor.py and SHA-256 lines
#   github-release  contents: write: GitHub release with pusharmor.py, its
#                   SHA-256 line, the sdist and the wheel
#   publish         Environment pypi, id-token: write: PyPI Trusted Publishing
# The version in pusharmor.py is stamped in the repo by release/tag.mjs and
# checked by --check; the build does not change it. Only this file holds the
# write and id-token permissions; ci.yml never calls it.
on:
  push:
    tags:
      - "cli/v*"

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Fails early: the tag rule, version files and the release gate before any build.
  tag:
    name: release tag rule and version files
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: site/.node-version
      - name: Release tag rule
        run: node release/tag.mjs --check "$TAG"
      # The release gate: the platform's ci jobs and the shared checks
      # succeeded on the tag commit (waits up to 40 minutes for a running ci
      # workflow), so this workflow does not run those tests again.
      - name: release gate on the tag commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: node release/tag.mjs --ci "$TAG"

  build:
    name: build sdist, wheel and pusharmor.py
    needs: tag
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Build
        working-directory: client/cli
        run: |
          python -m pip install --require-hashes -r build-requirements.txt
          python -m build --no-isolation
      - name: Release files and SHA-256 lines
        run: |
          mkdir -p release-files
          cp client/cli/pusharmor.py release-files/
          cp client/cli/dist/* release-files/
          cd release-files
          sha256sum pusharmor.py > pusharmor.py.sha256
          sha256sum -- pusharmor.py *.whl *.tar.gz > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cli-release-files
          path: release-files/
          retention-days: 7
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cli-dist
          path: client/cli/dist/
          retention-days: 7
          if-no-files-found: error

  github-release:
    name: GitHub release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cli-release-files
          path: release-files/
      - name: Check the SHA-256 lines
        working-directory: release-files
        run: sha256sum -c SHA256SUMS
      - name: GitHub release
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            draft="$(gh release view "$TAG" --json isDraft --jq '.isDraft')"
            if [ "$draft" != "true" ]; then
              echo "::error::Release $TAG is published (immutable); refusing to change its assets"
              exit 1
            fi
            gh release upload "$TAG" --clobber release-files/pusharmor.py release-files/pusharmor.py.sha256 release-files/*.whl release-files/*.tar.gz
          else
            gh release create "$TAG" --draft --prerelease=false --latest=false --verify-tag --title "$TAG" \
              --notes "PushArmor command-line client. Check pusharmor.py against pusharmor.py.sha256." \
              release-files/pusharmor.py release-files/pusharmor.py.sha256 release-files/*.whl release-files/*.tar.gz
          fi
          gh release edit "$TAG" --draft=false --prerelease=false --latest=false

  publish:
    name: publish to PyPI
    needs: [build, github-release]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cli-dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
