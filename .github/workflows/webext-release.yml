name: webext-release

# chrome/vX.Y.Z and firefox/vX.Y.Z tags (release/tag.mjs):
# the tag rule and the release gate (webext.yml passed in ci) first, then the jobs
# for the browser of the tag, so npm packages and repo scripts never share a job
# with id-token or write permissions:
#   build-<browser>    no Environment, no secrets: npm ci, release build and
#                      checks; the release zip, the Beta zip ("PushArmor Beta"),
#                      (Chrome) the plain-named zip (the store zip with the
#                      public item's key, for "Load unpacked"; the key-free
#                      store zip is the -store.zip) and (Firefox)
#                      the source archive, with their SHA-256
#   publish-chrome     no Environment: verifies the SHA-256, provenance,
#                      GitHub release with the -store, plain-named and Beta zips
#   publish-firefox    no Environment: verifies every SHA-256, provenance,
#                      GitHub release (public zip, source) as a draft, then
#                      publish
# Nothing goes to the Chrome Web Store or AMO, and no job here can get a store
# credential: the promote workflow uploads the public zip of the release
# (store.yml, RELEASING.md). Only this file holds write permissions; ci.yml
# never calls it.
on:
  push:
    tags:
      - "chrome/v*"
      - "firefox/v*"

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Fails early: the tag rule and the release gate before any build.
  tag:
    name: release tag rule
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: site/.node-version
      - name: Release tag rule
        run: node release/tag.mjs --check "$TAG"
      # The release gate: the platform's ci jobs and the shared checks
      # succeeded on the tag commit (waits up to 40 minutes for a running ci
      # workflow), so this workflow does not run those tests again.
      - name: release gate on the tag commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: node release/tag.mjs --ci "$TAG"

  build-chrome:
    name: build Chrome (release and Beta zips, checks)
    if: startsWith(github.ref, 'refs/tags/chrome/v')
    needs: tag
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      TAG: ${{ github.ref_name }}
    outputs:
      version: ${{ steps.tag.outputs.version }}
      zip_sha256: ${{ steps.files.outputs.zip_sha256 }}
      unpacked_sha256: ${{ steps.files.outputs.unpacked_sha256 }}
      beta_sha256: ${{ steps.files.outputs.beta_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: site/.node-version
      - name: Release tag rule and release values
        id: tag
        run: |
          version="$(node release/tag.mjs --check "$TAG")"
          node release/public.mjs --check webpush_vapid_public_key mozilla_firefox_addon_id mozilla_firefox_beta_addon_id \
            google_chrome_extension_id google_chrome_beta_extension_id google_chrome_dev_key
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Install
        working-directory: client/webext-common
        run: npm ci --ignore-scripts
      - name: Release build (runs check-release.mjs on the release, -unpacked and Beta zips)
        working-directory: client/webext-common
        env:
          PA_VERSION: ${{ steps.tag.outputs.version }}
        run: node build.mjs
      - name: Check the zips, their versions and names
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          d=client/chrome/dist
          node client/webext-common/check-release.mjs "$d/pusharmor-chrome.zip" "$d/pusharmor-chrome-unpacked.zip" "$d/pusharmor-chrome-beta.zip"
          for m in "$d/unpacked/manifest.json:PushArmor" "$d/beta/unpacked/manifest.json:PushArmor Beta"; do
            got="$(node -p 'const m = require(process.argv[1]); m.version + " " + m.name' "$PWD/${m%%:*}")"
            if [ "$got" != "$VERSION ${m#*:}" ]; then
              echo "${m%%:*}: $got, want $VERSION ${m#*:}"
              exit 1
            fi
          done
      - name: Release files, SHA-256 lines and file-hash manifest
        id: files
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          out="$RUNNER_TEMP/release"
          mkdir -p "$out" "$RUNNER_TEMP/unzip"
          zip="pusharmor-chrome-$VERSION-store.zip"
          unpacked="pusharmor-chrome-$VERSION.zip"
          beta="pusharmor-chrome-beta-$VERSION.zip"
          cp client/chrome/dist/pusharmor-chrome.zip "$out/$zip"
          cp client/chrome/dist/pusharmor-chrome-unpacked.zip "$out/$unpacked"
          cp client/chrome/dist/pusharmor-chrome-beta.zip "$out/$beta"
          node client/webext-common/check-release.mjs "$out/$zip" "$out/$unpacked"
          unzip -q "$out/$zip" -d "$RUNNER_TEMP/unzip"
          (cd "$RUNNER_TEMP/unzip" && find . -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum) > "$out/$zip.files.sha256"
          (cd "$out" && sha256sum "$zip" "$unpacked" "$beta") > "$out/pusharmor-chrome-$VERSION.hashes.txt"
          cat "$out/pusharmor-chrome-$VERSION.hashes.txt"
          {
            echo "zip_sha256=$(sha256sum "$out/$zip" | cut -d' ' -f1)"
            echo "unpacked_sha256=$(sha256sum "$out/$unpacked" | cut -d' ' -f1)"
            echo "beta_sha256=$(sha256sum "$out/$beta" | cut -d' ' -f1)"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: webext-chrome
          path: ${{ runner.temp }}/release/
          retention-days: 30
          if-no-files-found: error

  publish-chrome:
    name: publish Chrome (GitHub release)
    if: startsWith(github.ref, 'refs/tags/chrome/v')
    needs: build-chrome
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      TAG: ${{ github.ref_name }}
      VERSION: ${{ needs.build-chrome.outputs.version }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: webext-chrome
          path: ${{ runner.temp }}/release
      - name: Verify the zip SHA-256 values against the build job
        id: files
        env:
          ZIP_SHA256: ${{ needs.build-chrome.outputs.zip_sha256 }}
          UNPACKED_SHA256: ${{ needs.build-chrome.outputs.unpacked_sha256 }}
          BETA_SHA256: ${{ needs.build-chrome.outputs.beta_sha256 }}
        run: |
          out="$RUNNER_TEMP/release"
          zip="pusharmor-chrome-$VERSION-store.zip"
          unpacked="pusharmor-chrome-$VERSION.zip"
          beta="pusharmor-chrome-beta-$VERSION.zip"
          printf '%s  %s\n%s  %s\n%s  %s\n' "$ZIP_SHA256" "$zip" "$UNPACKED_SHA256" "$unpacked" "$BETA_SHA256" "$beta" > "$RUNNER_TEMP/expect.sha256"
          (cd "$out" && sha256sum -c --strict "$RUNNER_TEMP/expect.sha256")
          {
            echo "dir=$out"
            echo "zip=$out/$zip"
            echo "unpacked=$out/$unpacked"
            echo "beta=$out/$beta"
          } >> "$GITHUB_OUTPUT"
      # Build provenance attestation (needs a public repo or an org plan; skipped if the repo is private).
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: ${{ !github.event.repository.private }}
        with:
          subject-path: |
            ${{ steps.files.outputs.zip }}
            ${{ steps.files.outputs.unpacked }}
            ${{ steps.files.outputs.beta }}
      # Immutable releases: the release is created as a draft, gets every asset,
      # then is published. A rerun replaces the assets of a draft; a published
      # release is never touched.
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DIR: ${{ steps.files.outputs.dir }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            draft="$(gh release view "$TAG" --json isDraft --jq '.isDraft')"
            if [ "$draft" != "true" ]; then
              echo "::error::Release $TAG is published (immutable); refusing to change its assets"
              exit 1
            fi
            gh release upload "$TAG" --clobber "$DIR"/*
          else
            gh release create "$TAG" --draft --prerelease=false --latest=false --verify-tag --title "$TAG" \
              --notes "PushArmor $VERSION for Chrome." \
              "$DIR"/*
          fi
          gh release edit "$TAG" --draft=false --prerelease=false --latest=false

  build-firefox:
    name: build Firefox (release and Beta zips, source archive, checks)
    if: startsWith(github.ref, 'refs/tags/firefox/v')
    needs: tag
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      TAG: ${{ github.ref_name }}
    outputs:
      version: ${{ steps.tag.outputs.version }}
      zip_sha256: ${{ steps.files.outputs.zip_sha256 }}
      src_sha256: ${{ steps.files.outputs.src_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: site/.node-version
      - name: Release tag rule and release values
        id: tag
        run: |
          version="$(node release/tag.mjs --check "$TAG")"
          node release/public.mjs --check webpush_vapid_public_key mozilla_firefox_addon_id mozilla_firefox_beta_addon_id
          {
            echo "version=$version"
            echo "beta_id=$(node -p 'require(process.argv[1]).mozilla_firefox_beta_addon_id' "$PWD/release/public.json")"
          } >> "$GITHUB_OUTPUT"
      - name: Install
        working-directory: client/webext-common
        run: npm ci --ignore-scripts
      - name: Release build (runs check-release.mjs on the release and Beta zips)
        working-directory: client/webext-common
        env:
          PA_VERSION: ${{ steps.tag.outputs.version }}
        run: node build.mjs
      - name: Check the zips, their versions, names and gecko ids
        env:
          VERSION: ${{ steps.tag.outputs.version }}
          BETA_ID: ${{ steps.tag.outputs.beta_id }}
        run: |
          d=client/firefox/dist
          node client/webext-common/check-release.mjs "$d/pusharmor-firefox.zip" "$d/pusharmor-firefox-beta.zip"
          got="$(node -p 'const m = require(process.argv[1]); m.version + " " + m.name + " " + m.browser_specific_settings.gecko.id' "$PWD/$d/beta/unpacked/manifest.json")"
          [ "$got" = "$VERSION PushArmor Beta $BETA_ID" ] || { echo "Beta manifest: $got"; exit 1; }
          got="$(node -p 'const m = require(process.argv[1]); m.version + " " + m.name' "$PWD/$d/unpacked/manifest.json")"
          [ "$got" = "$VERSION PushArmor" ] || { echo "manifest: $got"; exit 1; }
      - name: Release files, source archive, SHA-256 lines and file-hash manifest
        id: files
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          out="$RUNNER_TEMP/release"
          mkdir -p "$out" "$RUNNER_TEMP/unzip"
          zip="pusharmor-firefox-$VERSION.zip"
          src="pusharmor-firefox-$VERSION-source.zip"
          cp client/firefox/dist/pusharmor-firefox.zip "$out/$zip"
          # The added release/source-tag.txt names the tag, so a build of the source
          # archive (no .git) gets X.Y.Z too (buildVersion in release/tag.mjs).
          mkdir -p "$RUNNER_TEMP/srctag"
          printf '%s\n' "$TAG" > "$RUNNER_TEMP/srctag/source-tag.txt"
          git archive --format=zip --prefix="pusharmor-$VERSION/release/" --add-file="$RUNNER_TEMP/srctag/source-tag.txt" \
            --prefix="pusharmor-$VERSION/" -o "$out/$src" "$TAG"
          unzip -q "$out/$zip" -d "$RUNNER_TEMP/unzip"
          (cd "$RUNNER_TEMP/unzip" && find . -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum) > "$out/$zip.files.sha256"
          {
            echo "zip_sha256=$(sha256sum "$out/$zip" | cut -d' ' -f1)"
            echo "src_sha256=$(sha256sum "$out/$src" | cut -d' ' -f1)"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: webext-firefox
          path: ${{ runner.temp }}/release/
          retention-days: 30
          if-no-files-found: error

  publish-firefox:
    name: publish Firefox (GitHub release)
    if: startsWith(github.ref, 'refs/tags/firefox/v')
    needs: build-firefox
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      TAG: ${{ github.ref_name }}
      VERSION: ${{ needs.build-firefox.outputs.version }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: webext-firefox
          path: ${{ runner.temp }}/release
      - name: Verify the SHA-256 values against the build job
        id: files
        env:
          ZIP_SHA256: ${{ needs.build-firefox.outputs.zip_sha256 }}
          SRC_SHA256: ${{ needs.build-firefox.outputs.src_sha256 }}
        run: |
          out="$RUNNER_TEMP/release"
          zip="pusharmor-firefox-$VERSION.zip"
          src="pusharmor-firefox-$VERSION-source.zip"
          printf '%s  %s\n%s  %s\n' "$ZIP_SHA256" "$zip" "$SRC_SHA256" "$src" > "$RUNNER_TEMP/expect.sha256"
          (cd "$out" && sha256sum -c --strict "$RUNNER_TEMP/expect.sha256")
          (cd "$out" && sha256sum "$zip" "$src") > "$out/pusharmor-firefox-$VERSION.hashes.txt"
          cat "$out/pusharmor-firefox-$VERSION.hashes.txt"
          {
            echo "dir=$out"
            echo "zip=$out/$zip"
            echo "src=$out/$src"
          } >> "$GITHUB_OUTPUT"
      # Build provenance attestation (needs a public repo or an org plan; skipped if the repo is private).
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: ${{ !github.event.repository.private }}
        with:
          subject-path: |
            ${{ steps.files.outputs.zip }}
            ${{ steps.files.outputs.src }}
      # Immutable releases: the release is created as a draft, gets every asset,
      # then is published. A rerun replaces the assets of a draft; a published
      # release is never touched.
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DIR: ${{ steps.files.outputs.dir }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            draft="$(gh release view "$TAG" --json isDraft --jq '.isDraft')"
            if [ "$draft" != "true" ]; then
              echo "::error::Release $TAG is published (immutable); refusing to change its assets"
              exit 1
            fi
            gh release upload "$TAG" --clobber "$DIR"/*
          else
            gh release create "$TAG" --draft --prerelease=false --latest=false --verify-tag --title "$TAG" \
              --notes "PushArmor $VERSION for Firefox." \
              "$DIR"/*
          fi
          gh release edit "$TAG" --draft=false --prerelease=false --latest=false
