name: webext-release

# chrome-v* and firefox-v* tags: the golden vectors and the webext tests run
# first, then two jobs for the browser of the tag, so npm packages and repo
# scripts never share a job with the Environment, its secrets or id-token:
#   build-<browser>    no Environment, no secrets: npm ci, release build and
#                      checks, release files; uploads them with their SHA-256
#   publish-<browser>  Environment chrome-release / firefox-release (owner
#                      approval): verifies the SHA-256, provenance, draft GitHub
#                      Release; Chrome then submits to the store as the last step
#   submit-firefox     Environment firefox-release, contents: read, no id-token:
#                      verifies the SHA-256, npm ci web-ext, AMO submission
# Only this file holds write permissions; ci.yml never calls it.
on:
  push:
    tags:
      - "chrome-v*"
      - "firefox-v*"

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  vectors:
    permissions:
      contents: read
    uses: ./.github/workflows/vectors.yml

  test:
    permissions:
      contents: read
    uses: ./.github/workflows/webext.yml

  build-chrome:
    name: build Chrome (release zip, checks)
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/chrome-v')
    needs: [test, vectors]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      TAG: ${{ github.ref_name }}
    outputs:
      version: ${{ steps.tag.outputs.version }}
      zip_sha256: ${{ steps.files.outputs.zip_sha256 }}
      google_cws_wif_provider: ${{ steps.cws.outputs.google_cws_wif_provider }}
      google_cws_wif_service_account: ${{ steps.cws.outputs.google_cws_wif_service_account }}
      google_cws_publisher_id: ${{ steps.cws.outputs.google_cws_publisher_id }}
      google_chrome_extension_id: ${{ steps.cws.outputs.google_chrome_extension_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: site/.node-version
      - name: Release tag rule and release values
        id: tag
        run: |
          version="$(node release/tag.mjs chrome "$TAG")"
          node release/public.mjs --check webpush_vapid_public_key mozilla_firefox_addon_id \
            google_chrome_extension_id google_cws_publisher_id \
            google_cws_wif_provider google_cws_wif_service_account
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Chrome Web Store ids for the publish job
        id: cws
        run: |
          node -e '
            const p = require(process.argv[1]);
            for (const k of ["google_cws_wif_provider", "google_cws_wif_service_account", "google_cws_publisher_id", "google_chrome_extension_id"])
              console.log(k + "=" + p[k]);
          ' "$PWD/release/public.json" >> "$GITHUB_OUTPUT"
      - name: Install
        working-directory: client/webext-common
        run: npm ci --ignore-scripts
      - name: Release build (runs check-release.mjs)
        working-directory: client/webext-common
        run: node build.mjs
      - name: Check the release zip and its version
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          node client/webext-common/check-release.mjs client/chrome/dist/pusharmor-chrome.zip
          got="$(node -p 'require(process.argv[1]).version' "$PWD/client/chrome/dist/unpacked/manifest.json")"
          if [ "$got" != "$VERSION" ]; then
            echo "manifest version $got does not equal the tag version $VERSION"
            exit 1
          fi
      - name: Release files, SHA-256 lines and file-hash manifest
        id: files
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          out="$RUNNER_TEMP/release"
          mkdir -p "$out" "$RUNNER_TEMP/unzip"
          zip="pusharmor-chrome-$VERSION.zip"
          cp client/chrome/dist/pusharmor-chrome.zip "$out/$zip"
          unzip -q "$out/$zip" -d "$RUNNER_TEMP/unzip"
          (cd "$RUNNER_TEMP/unzip" && find . -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum) > "$out/$zip.files.sha256"
          (cd "$out" && sha256sum "$zip") > "$out/pusharmor-chrome-$VERSION.hashes.txt"
          cat "$out/pusharmor-chrome-$VERSION.hashes.txt"
          echo "zip_sha256=$(sha256sum "$out/$zip" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: webext-chrome
          path: ${{ runner.temp }}/release/
          retention-days: 30
          if-no-files-found: error

  publish-chrome:
    name: publish Chrome (draft GitHub Release, Chrome Web Store review)
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/chrome-v')
    needs: build-chrome
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: chrome-release
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      TAG: ${{ github.ref_name }}
      VERSION: ${{ needs.build-chrome.outputs.version }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: webext-chrome
          path: ${{ runner.temp }}/release
      - name: Verify the release zip SHA-256 against the build job
        id: files
        env:
          ZIP_SHA256: ${{ needs.build-chrome.outputs.zip_sha256 }}
        run: |
          out="$RUNNER_TEMP/release"
          zip="pusharmor-chrome-$VERSION.zip"
          printf '%s  %s\n' "$ZIP_SHA256" "$zip" > "$RUNNER_TEMP/expect.sha256"
          (cd "$out" && sha256sum -c --strict "$RUNNER_TEMP/expect.sha256")
          {
            echo "dir=$out"
            echo "zip=$out/$zip"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.files.outputs.zip }}
      - name: Draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DIR: ${{ steps.files.outputs.dir }}
        run: gh release create "$TAG" --draft --verify-tag --title "$TAG" "$DIR"/*
      - id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ needs.build-chrome.outputs.google_cws_wif_provider }}
          service_account: ${{ needs.build-chrome.outputs.google_cws_wif_service_account }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/chromewebstore
          create_credentials_file: false
      # Last step: upload, then submit for review. A failure after the upload is
      # fixed with a new patch tag.
      - name: Upload to the Chrome Web Store and submit for review
        env:
          TOKEN: ${{ steps.auth.outputs.access_token }}
          PUB: ${{ needs.build-chrome.outputs.google_cws_publisher_id }}
          ITEM: ${{ needs.build-chrome.outputs.google_chrome_extension_id }}
          ZIP: ${{ steps.files.outputs.zip }}
        run: |
          api="https://chromewebstore.googleapis.com"
          item="publishers/$PUB/items/$ITEM"
          r="$(curl -fsS -X POST -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/zip" \
            --data-binary "@$ZIP" "$api/upload/v2/$item:upload")"
          echo "$r"
          state="$(printf '%s' "$r" | jq -r '.uploadState // empty')"
          n=0
          while [ "$state" = "IN_PROGRESS" ] && [ "$n" -lt 30 ]; do
            sleep 10
            n=$((n + 1))
            r="$(curl -fsS -H "Authorization: Bearer $TOKEN" "$api/v2/$item:fetchStatus")"
            state="$(printf '%s' "$r" | jq -r '.lastAsyncUploadState // empty')"
          done
          if [ "$state" != "SUCCEEDED" ]; then
            echo "upload state: ${state:-none}"
            echo "$r"
            exit 1
          fi
          curl -fsS -X POST -H "Authorization: Bearer $TOKEN" "$api/v2/$item:publish"

  build-firefox:
    name: build Firefox (release zip, source archive, checks)
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/firefox-v')
    needs: [test, vectors]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      TAG: ${{ github.ref_name }}
    outputs:
      version: ${{ steps.tag.outputs.version }}
      zip_sha256: ${{ steps.files.outputs.zip_sha256 }}
      src_sha256: ${{ steps.files.outputs.src_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: site/.node-version
      - name: Release tag rule and release values
        id: tag
        run: |
          version="$(node release/tag.mjs firefox "$TAG")"
          node release/public.mjs --check webpush_vapid_public_key mozilla_firefox_addon_id
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Install
        working-directory: client/webext-common
        run: npm ci --ignore-scripts
      - name: Release build (runs check-release.mjs)
        working-directory: client/webext-common
        run: node build.mjs
      - name: Check the release zip and its version
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          node client/webext-common/check-release.mjs client/firefox/dist/pusharmor-firefox.zip
          got="$(node -p 'require(process.argv[1]).version' "$PWD/client/firefox/dist/unpacked/manifest.json")"
          if [ "$got" != "$VERSION" ]; then
            echo "manifest version $got does not equal the tag version $VERSION"
            exit 1
          fi
      - name: Release files, source archive, SHA-256 lines and file-hash manifest
        id: files
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          out="$RUNNER_TEMP/release"
          mkdir -p "$out" "$RUNNER_TEMP/unzip"
          zip="pusharmor-firefox-$VERSION.zip"
          src="pusharmor-firefox-$VERSION-source.zip"
          cp client/firefox/dist/pusharmor-firefox.zip "$out/$zip"
          git archive --format=zip --prefix="pusharmor-$TAG/" -o "$out/$src" "$TAG"
          unzip -q "$out/$zip" -d "$RUNNER_TEMP/unzip"
          (cd "$RUNNER_TEMP/unzip" && find . -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum) > "$out/$zip.files.sha256"
          (cd "$out" && sha256sum "$zip" "$src") > "$out/pusharmor-firefox-$VERSION.hashes.txt"
          cat "$out/pusharmor-firefox-$VERSION.hashes.txt"
          {
            echo "zip_sha256=$(sha256sum "$out/$zip" | cut -d' ' -f1)"
            echo "src_sha256=$(sha256sum "$out/$src" | cut -d' ' -f1)"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: webext-firefox
          path: ${{ runner.temp }}/release/
          retention-days: 30
          if-no-files-found: error

  publish-firefox:
    name: publish Firefox (draft GitHub Release, AMO review)
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/firefox-v')
    needs: build-firefox
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: firefox-release
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      TAG: ${{ github.ref_name }}
      VERSION: ${{ needs.build-firefox.outputs.version }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: webext-firefox
          path: ${{ runner.temp }}/release
      - name: Verify the release zip and source archive SHA-256 against the build job
        id: files
        env:
          ZIP_SHA256: ${{ needs.build-firefox.outputs.zip_sha256 }}
          SRC_SHA256: ${{ needs.build-firefox.outputs.src_sha256 }}
        run: |
          out="$RUNNER_TEMP/release"
          zip="pusharmor-firefox-$VERSION.zip"
          src="pusharmor-firefox-$VERSION-source.zip"
          printf '%s  %s\n%s  %s\n' "$ZIP_SHA256" "$zip" "$SRC_SHA256" "$src" > "$RUNNER_TEMP/expect.sha256"
          (cd "$out" && sha256sum -c --strict "$RUNNER_TEMP/expect.sha256")
          {
            echo "dir=$out"
            echo "zip=$out/$zip"
            echo "src=$out/$src"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            ${{ steps.files.outputs.zip }}
            ${{ steps.files.outputs.src }}
      - name: Draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DIR: ${{ steps.files.outputs.dir }}
        run: gh release create "$TAG" --draft --verify-tag --title "$TAG" "$DIR"/*

  submit-firefox:
    name: submit Firefox to AMO (web-ext sign)
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/firefox-v')
    needs: [build-firefox, publish-firefox]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: firefox-release
    # No OIDC token here: web-ext and its packages cannot mint one.
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.build-firefox.outputs.version }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: webext-firefox
          path: ${{ runner.temp }}/release
      - name: Verify the release zip and source archive SHA-256 against the build job
        id: files
        env:
          ZIP_SHA256: ${{ needs.build-firefox.outputs.zip_sha256 }}
          SRC_SHA256: ${{ needs.build-firefox.outputs.src_sha256 }}
        run: |
          out="$RUNNER_TEMP/release"
          zip="pusharmor-firefox-$VERSION.zip"
          src="pusharmor-firefox-$VERSION-source.zip"
          printf '%s  %s\n%s  %s\n' "$ZIP_SHA256" "$zip" "$SRC_SHA256" "$src" > "$RUNNER_TEMP/expect.sha256"
          (cd "$out" && sha256sum -c --strict "$RUNNER_TEMP/expect.sha256")
          # web-ext sign takes a directory: the verified zip, unpacked.
          mkdir -p "$RUNNER_TEMP/unpacked"
          unzip -q "$out/$zip" -d "$RUNNER_TEMP/unpacked"
          echo "src=$out/$src" >> "$GITHUB_OUTPUT"
      # web-ext only, exact version from its own lockfile (npm integrity hashes),
      # no install scripts; installed before any secret is in the environment.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: client/webext-common/amo-sign
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: site/.node-version
      - name: Install web-ext (amo-sign lockfile)
        working-directory: client/webext-common/amo-sign
        run: npm ci --ignore-scripts
      # Last step: upload to AMO for review (listed channel) without waiting for
      # approval. A failure after the upload is fixed with a new patch tag.
      - name: Submit to AMO (web-ext sign, listed)
        working-directory: client/webext-common/amo-sign
        env:
          WEB_EXT_API_KEY: ${{ secrets.MOZILLA_AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.MOZILLA_AMO_JWT_SECRET }}
          SRC: ${{ steps.files.outputs.src }}
        run: |
          npx --no-install web-ext sign --no-input \
            --source-dir "$RUNNER_TEMP/unpacked" \
            --artifacts-dir "$RUNNER_TEMP/web-ext" \
            --channel listed \
            --upload-source-code "$SRC" \
            --approval-timeout 0
