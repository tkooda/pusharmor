name: collect

# After store review (component-ci-r1 sections 2 and 4.5): fetch the store-signed
# CRX (Chrome Web Store update URL) and XPI (AMO API, no credentials) that the
# public item serves now, take the chrome/v or firefox/v tag of that version (any
# promoted version, also when newer test tags exist), check every file against
# the release file-hash manifest (<zip>.files.sha256 of the GitHub Release), and
# publish the unchanged store file with its SHA-256 as its own release
# store/<browser>/vX.Y.Z (draft with both files, then published: releases are
# immutable, so the published tag release never gets new files). Store-added
# files are skipped: Chrome _metadata/, and the release/constants.json lists
# ("cws_added": manifest.json keys; "amo_added": path prefixes). manifest.json is
# compared as parsed JSON. No public store version yet, no tag or release of it,
# or an existing store release, is a skip, not a failure. A draft store release
# left by a failed run is deleted and created again.
on:
  schedule:
    - cron: "23 6 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  collect:
    name: collect ${{ matrix.browser }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Write is needed to publish the store release. No
    # third-party action runs in this job.
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: chrome
            ext: crx
            id_key: google_chrome_extension_id
          - browser: firefox
            ext: xpi
            id_key: mozilla_firefox_addon_id
    env:
      BROWSER: ${{ matrix.browser }}
      EXT: ${{ matrix.ext }}
      ID_KEY: ${{ matrix.id_key }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true
      - name: The store file and its version
        id: store
        run: |
          skip() { echo "skip: $1"; echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0; }
          id="$(python3 -I -c 'import json,sys; print(json.load(open(sys.argv[1])).get(sys.argv[2]) or "")' "$PWD/release/public.json" "$ID_KEY")"
          if [ -z "$id" ] || printf '%s' "$id" | grep -qi placeholder; then skip "$ID_KEY is not set"; fi
          f="$RUNNER_TEMP/store.$EXT"
          if [ "$BROWSER" = chrome ]; then
            url="https://clients2.google.com/service/update2/crx?response=redirect&prodversion=140.0&acceptformat=crx2,crx3&x=id%3D$id%26uc"
            code="$(curl -sSL -o "$f" -w '%{http_code}' "$url")"
            if [ "$code" != 200 ] || [ ! -s "$f" ]; then skip "Chrome Web Store returned HTTP $code"; fi
            # zipfile reads past the CRX header (data before the archive).
            version="$(python3 -I -c 'import json,sys,zipfile; print(json.loads(zipfile.ZipFile(sys.argv[1]).read("manifest.json")).get("version", ""))' "$f")"
          else
            gid="$(python3 -I -c 'import sys,urllib.parse; print(urllib.parse.quote(sys.argv[1], safe=""))' "$id")"
            code="$(curl -sS -o "$RUNNER_TEMP/amo.json" -w '%{http_code}' "https://addons.mozilla.org/api/v5/addons/addon/$gid/")"
            [ "$code" = 200 ] || skip "AMO has no listed add-on yet (HTTP $code)"
            version="$(jq -r '.current_version.version // empty' "$RUNNER_TEMP/amo.json")"
            status="$(jq -r '.current_version.file.status // empty' "$RUNNER_TEMP/amo.json")"
            [ "$status" = public ] || skip "AMO file status of ${version:-unknown} is ${status:-unknown}"
            curl -fsSL -o "$f" "$(jq -r '.current_version.file.url' "$RUNNER_TEMP/amo.json")"
          fi
          printf '%s' "$version" | grep -qxE '[0-9]+\.[0-9]+\.[0-9]+' || skip "store version ${version:-unknown} is not X.Y.Z"
          {
            echo "skip=false"
            echo "id=$id"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"
      - name: The tag of the store version, its release and the release files
        id: find
        if: steps.store.outputs.skip == 'false'
        env:
          VERSION: ${{ steps.store.outputs.version }}
        run: |
          skip() { echo "skip: $1"; echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0; }
          tag="$BROWSER/v$VERSION"
          git rev-parse -q --verify "refs/tags/$tag" > /dev/null || skip "no tag $tag for the store version"
          gh release view "$tag" --json assets --jq '.assets[].name' > "$RUNNER_TEMP/assets.txt" || skip "no GitHub Release for $tag"
          store_tag="store/$BROWSER/v$VERSION"
          if draft="$(gh release view "$store_tag" --json isDraft --jq .isDraft 2>/dev/null)"; then
            [ "$draft" = true ] || skip "$store_tag already exists"
            gh release delete "$store_tag" --yes
          fi
          name="pusharmor-$BROWSER-$VERSION"
          grep -qx "$name.zip.files.sha256" "$RUNNER_TEMP/assets.txt" || skip "$tag has no $name.zip.files.sha256"
          mkdir -p "$RUNNER_TEMP/rel"
          gh release download "$tag" --dir "$RUNNER_TEMP/rel" --pattern "$name.zip" --pattern "$name.zip.files.sha256"
          {
            echo "skip=false"
            echo "tag=$tag"
            echo "store_tag=$store_tag"
            echo "name=$name"
          } >> "$GITHUB_OUTPUT"
      - name: Check the store file against the release file-hash manifest
        id: check
        if: steps.store.outputs.skip == 'false' && steps.find.outputs.skip == 'false'
        env:
          NAME: ${{ steps.find.outputs.name }}
          VERSION: ${{ steps.store.outputs.version }}
        run: |
          rc=0
          python3 -I - "$RUNNER_TEMP/store.$EXT" "$RUNNER_TEMP/rel/$NAME.zip" "$RUNNER_TEMP/rel/$NAME.zip.files.sha256" \
            "$PWD/release/constants.json" "$BROWSER" "$VERSION" <<'PY' || rc=$?
          import hashlib, io, json, struct, sys, zipfile
          store_path, ours_path, manifest_path, constants_path, browser, version = sys.argv[1:7]
          const = json.load(open(constants_path))
          data = open(store_path, "rb").read()
          if browser == "chrome":
              if data[:4] != b"Cr24":
                  sys.exit("not a CRX file")
              v = struct.unpack("<I", data[4:8])[0]
              if v == 3:
                  start = 12 + struct.unpack("<I", data[8:12])[0]
              elif v == 2:
                  start = 16 + sum(struct.unpack("<II", data[8:16]))
              else:
                  sys.exit("unknown CRX version %d" % v)
              data = data[start:]
              skip_prefixes = ["_metadata/"]
              drop_keys = const.get("cws_added", [])
          else:
              skip_prefixes = const.get("amo_added", [])
              drop_keys = []
          store = zipfile.ZipFile(io.BytesIO(data))
          ours = zipfile.ZipFile(ours_path)
          want = {}
          for line in open(manifest_path):
              h, p = line.rstrip("\n").split("  ", 1)
              want[p[2:] if p.startswith("./") else p] = h
          sha = lambda b: hashlib.sha256(b).hexdigest()
          ours_files = {n: ours.read(n) for n in ours.namelist() if not n.endswith("/")}
          if {n: sha(b) for n, b in ours_files.items()} != want:
              sys.exit("the release zip does not match its own file-hash manifest")
          store_files = {n: store.read(n) for n in store.namelist()
                         if not n.endswith("/") and not any(n.startswith(p) for p in skip_prefixes)}
          sm = json.loads(store_files.get("manifest.json", b"{}"))
          if sm.get("version") != version:
              print("store version %s is not the tag version %s yet" % (sm.get("version"), version))
              sys.exit(3)
          for k in drop_keys:
              sm.pop(k, None)
          bad = []
          if sm != json.loads(ours_files["manifest.json"]):
              bad.append("manifest.json differs (parsed, store-added keys dropped)")
          for n in sorted(set(want) | set(store_files)):
              if n == "manifest.json":
                  continue
              if n not in store_files:
                  bad.append("missing in the store file: " + n)
              elif n not in want:
                  bad.append("not in the release: " + n)
              elif sha(store_files[n]) != want[n]:
                  bad.append("differs: " + n)
          if bad:
              sys.exit("store file check failed:\n  - " + "\n  - ".join(bad))
          print("ok: %d files match" % len(want))
          PY
          case "$rc" in
            0) echo "skip=false" >> "$GITHUB_OUTPUT" ;;
            3) echo "skip=true" >> "$GITHUB_OUTPUT" ;;
            *) exit "$rc" ;;
          esac
      - name: Publish the store file and its SHA-256 as the store release
        if: steps.check.outputs.skip == 'false'
        env:
          TAG: ${{ steps.find.outputs.tag }}
          STORE_TAG: ${{ steps.find.outputs.store_tag }}
          NAME: ${{ steps.find.outputs.name }}
        run: |
          d="$RUNNER_TEMP/out"
          mkdir -p "$d"
          cp "$RUNNER_TEMP/store.$EXT" "$d/$NAME.$EXT"
          (cd "$d" && sha256sum "$NAME.$EXT") > "$d/$NAME.$EXT.sha256"
          cat "$d/$NAME.$EXT.sha256"
          sha="$(git rev-list -n 1 "refs/tags/$TAG")"
          gh release create "$STORE_TAG" --draft --prerelease=false --latest=false --target "$sha" --title "$STORE_TAG" \
            --notes "Store-signed $NAME.$EXT, checked against the file hashes of $TAG." \
            "$d/$NAME.$EXT" "$d/$NAME.$EXT.sha256"
          gh release edit "$STORE_TAG" --draft=false --latest=false
