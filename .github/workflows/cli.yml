name: cli

# Command-line client tests and build. Called by ci.yml; workflow_dispatch runs
# it on any branch by hand. Python 3.9 runs with the oldest supported
# cryptography and Python 3.14 with the newest, each on Linux and on Windows.
# Test and build tools are pinned by SHA-256 (test-requirements.txt,
# build-requirements.txt); cryptography is not, so the newest release is tested.
# The pinned setuptools needs Python 3.10 or later, so Python 3.9 runs the
# tests only (the wheel is pure Python and is built on 3.14).
on:
  workflow_call:
  workflow_dispatch:

permissions: {}

jobs:
  cli:
    name: tests and build (Python ${{ matrix.python }}${{ matrix.os == 'windows-latest' && ', Windows' || '' }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python: "3.9"
            cryptography: "cryptography==3.3.2"
          - os: ubuntu-24.04
            python: "3.14"
            cryptography: "cryptography"
          - os: windows-latest
            python: "3.9"
            cryptography: "cryptography==3.3.2"
          - os: windows-latest
            python: "3.14"
            cryptography: "cryptography"
    defaults:
      run:
        shell: bash
        working-directory: client/cli
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        env:
          CRYPTOGRAPHY: ${{ matrix.cryptography }}
          PY: ${{ matrix.python }}
        run: |
          if [ "$PY" = "3.9" ]; then
            python -m pip install --require-hashes -r test-requirements.txt
          else
            python -m pip install --require-hashes -r test-requirements.txt -r build-requirements.txt
          fi
          python -m pip install --upgrade "$CRYPTOGRAPHY"
          python -c "import cryptography; print(cryptography.__version__)"
      - name: Tests
        run: python -m pytest
      - name: Build sdist and wheel
        if: matrix.python != '3.9'
        run: python -m build --no-isolation
