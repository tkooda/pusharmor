name: vectors

# Golden cross-platform vectors (tests/vectors/golden-v1.json): the Node
# reference code checks the file itself. Each component suite (worker.yml,
# webext.yml, android.yml, ios.yml, cli.yml) runs the same file through its own
# production code. Called by ci.yml.
on:
  workflow_call:

permissions: {}

jobs:
  reference:
    name: reference (Node)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: site/.node-version
      - name: Check golden-v1.json with the reference code
        working-directory: tests/vectors
        run: node --test ref/check.mjs

