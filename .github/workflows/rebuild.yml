name: rebuild

# Reproducibility check (component-ci-r1 section 5): rebuilds the play and foss
# APKs of an android/v* tag on a fresh runner with the release pins and compares
# each to the signed GitHub Release asset with apksigcopier compare (equal apart
# from the signature). Read-only. Runs on a prerelease or a promoted release.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: android/vX.Y.Z tag to rebuild
        required: true
        type: string

permissions: {}

env:
  JAVA_VERSION: "17.0.20+8"
  SDK_PACKAGES: platforms;android-35 build-tools;35.0.0 build-tools;34.0.0 platform-tools
  # apksigcopier and its one dependency, pinned by version and wheel SHA-256.
  APKSIGCOPIER_REQS: |
    apksigcopier==1.1.1 --hash=sha256:0834bb7d6f3607bb0994cf8cd2e26b8f0c9d481e13b75872e0fa9cec052e519b
    click==8.5.0 --hash=sha256:255bc9599cf7748b4b1a446ccc735421bd08a2ae529a8b88597d3de5664ee360

jobs:
  rebuild-android:
    name: rebuild and compare the play and foss APKs
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
    env:
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: site/.node-version
      # Format check with release/tag.mjs parseTag (the "greater than every other
      # tag" rule does not apply to a rebuild of an older tag), then the tag must exist.
      - name: Validate the tag and check it out
        id: tag
        run: |
          version="$(node --input-type=module -e '
            import { parseTag } from "./release/tag.mjs";
            const t = parseTag(process.argv[1]);
            if (!t || t.platform !== "android") { console.error("not an android/vX.Y.Z tag: " + JSON.stringify(process.argv[1])); process.exit(1); }
            console.log(t.version);
          ' "$TAG")"
          git rev-parse -q --verify "refs/tags/$TAG^{commit}" > /dev/null || { echo "tag $TAG does not exist"; exit 1; }
          git checkout -q --detach "refs/tags/$TAG"
          echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct HEAD)" >> "$GITHUB_ENV"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-disabled: true
      - name: Android SDK packages (exact)
        run: |
          # shellcheck disable=SC2086
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install $SDK_PACKAGES < /dev/null
      - name: Release builds (play APK, foss APK)
        working-directory: client/android
        run: ./gradlew --no-daemon --stacktrace :app:assemblePlayRelease :app:assembleFossRelease
      - name: Download the release APKs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          gh release download "$TAG" --dir "$RUNNER_TEMP/release" \
            --pattern "pusharmor-$VERSION-play.apk" --pattern "pusharmor-$VERSION-foss.apk"
      - name: Install apksigcopier (pinned, hash-checked)
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          printf '%s' "$APKSIGCOPIER_REQS" > "$RUNNER_TEMP/reqs.txt"
          "$RUNNER_TEMP/venv/bin/pip" install --no-deps --only-binary :all: --require-hashes -r "$RUNNER_TEMP/reqs.txt"
      - name: apksigcopier compare (play, foss)
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          b=client/android/app/build/outputs/apk
          rc=0
          for f in play foss; do
            if "$RUNNER_TEMP/venv/bin/apksigcopier" compare "$RUNNER_TEMP/release/pusharmor-$VERSION-$f.apk" \
              --unsigned "$b/$f/release/app-$f-release-unsigned.apk"; then
              echo "$f: reproducible"
            else
              echo "$f: the rebuild differs from the release APK"
              rc=1
            fi
          done
          exit "$rc"
