name: promote

# the owner starts this workflow by hand
# (workflow_dispatch, also from the GitHub phone app) with a version X.Y.Z and
# approves it once (Environment promote, the owner is the required reviewer).
# It sends that SAME tested build to the public channel of each store. Nothing
# is rebuilt (release/promote.mjs; the store jobs are in store.yml):
#   play      Play internal versionCode to production, listing text, screenshots
#   appstore  TestFlight build to App Review, version page text, screenshots
#   chrome    public zip of the chrome/vX.Y.Z prerelease to the public item
#   firefox   public zip and source of the firefox/vX.Y.Z prerelease to the
#             listed add-on
# Only the platforms named in the platforms input run (a comma list, required,
# no default). A platform without tag and prerelease X.Y.Z is skipped. The
# release Environments allow only their own release tags, so this workflow
# holds no store secret: after the approval the dispatch job starts store.yml
# once per ready platform on the tag <platform>/vX.Y.Z (workflow_dispatch),
# and that run uses the store's release Environment for its secrets (WIF for
# Play and Chrome Web Store). Each store is its own run: rerun only the failed
# one. Every store job skips a version that is already live or in review.
# After its store accepts the build, each job clears the prerelease flag of
# its own GitHub release (not after a SKIP).
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version X.Y.Z to promote (tested on the test channels)"
        required: true
        type: string
      platforms:
        description: "Stores to promote, comma list of android, ios, chrome, firefox (no default)"
        required: true
        type: string

# store.yml checks the version and platform of the run that started it here.
run-name: promote ${{ inputs.version }} ${{ inputs.platforms }}

permissions: {}

concurrency:
  group: promote
  cancel-in-progress: false

env:
  VERSION: ${{ inputs.version }}

jobs:
  check:
    name: tags, prereleases and listings
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      android: ${{ steps.check.outputs.android }}
      ios: ${{ steps.check.outputs.ios }}
      chrome: ${{ steps.check.outputs.chrome }}
      firefox: ${{ steps.check.outputs.firefox }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: site/.node-version
      - id: check
        name: Version and listing check
        env:
          GH_TOKEN: ${{ github.token }}
          PLATFORMS: ${{ inputs.platforms }}
          # Play gate, tested before the owner approval.
          PLAY_CONTACT_OK: ${{ vars.PLAY_CONTACT_OK }}
          PLAY_PUBLIC_OK: ${{ vars.PLAY_PUBLIC_OK }}
        run: node release/promote.mjs check "$VERSION"

  approve:
    name: owner approval
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: promote
    permissions: {}
    steps:
      - name: Approved
        run: echo "Promote $VERSION approved"

  dispatch:
    name: start the store runs on the platform tags
    needs: [check, approve]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Start store.yml on each ready platform tag
        env:
          GH_TOKEN: ${{ github.token }}
          ANDROID: ${{ needs.check.outputs.android }}
          IOS: ${{ needs.check.outputs.ios }}
          CHROME: ${{ needs.check.outputs.chrome }}
          FIREFOX: ${{ needs.check.outputs.firefox }}
        run: |
          for pair in "android:$ANDROID" "ios:$IOS" "chrome:$CHROME" "firefox:$FIREFOX"; do
            p="${pair%%:*}"
            [ "${pair#*:}" = "true" ] || continue
            gh workflow run store.yml --repo "$GITHUB_REPOSITORY" --ref "$p/v$VERSION" -f version="$VERSION" -f promote_run="$GITHUB_RUN_ID"
            echo "- $p: store run started on $p/v$VERSION (Actions > store)" | tee -a "$GITHUB_STEP_SUMMARY"
          done
