name: android

# Android tests and builds. Called by ci.yml (pushes) and by
# android-release.yml before the release jobs; workflow_dispatch runs it on any
# branch by hand. Debug APKs are uploaded (not for tags). Release
# variants built here are never uploaded.
on:
  workflow_call:
  workflow_dispatch:

permissions: {}

env:
  JAVA_VERSION: "17.0.20+8"
  # Exact SDK packages; the runner's preinstalled SDK floats.
  SDK_PACKAGES: platforms;android-36 build-tools;35.0.0 build-tools;34.0.0 platform-tools

jobs:
  android-jvm:
    name: JVM and Robolectric tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        working-directory: client/android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      # Validates the wrapper jar checksum (on by default). Only a push to main
      # writes the cache; other branches read it.
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: ${{ !(github.event_name == 'push' && github.ref == 'refs/heads/main') }}
      # The Gradle dependency cache. Only a passing job on a push to main
      # saves it, so it holds every artifact this job resolves; other
      # branches restore it and seldom fetch from Maven Central.
      # Robolectric fetches its android-all jars from Maven Central into
      # ~/.m2 at test time; they are kept in the same cache.
      - id: deps
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.m2/repository/org/robolectric
          key: android-deps-jvm-${{ hashFiles('client/android/gradle/libs.versions.toml', 'client/android/**/*.gradle.kts') }}
          restore-keys: android-deps-jvm-
      - name: Unit tests
        run: >-
          ./gradlew --no-daemon --stacktrace --build-cache --parallel
          :crypto:test :protocol:test :net:test :store:testDebugUnitTest
          :app:testPlayDebugUnitTest :app:testFossDebugUnitTest
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-jvm-test-results
          path: client/android/*/build/test-results/
          retention-days: 7
      - name: Save the dependency cache (main only)
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.deps.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.m2/repository/org/robolectric
          key: ${{ steps.deps.outputs.cache-primary-key }}

  android-lint:
    name: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        working-directory: client/android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: site/.node-version
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: ${{ !(github.event_name == 'push' && github.ref == 'refs/heads/main') }}
      # The Gradle dependency cache. Only a passing job on a push to main
      # saves it, so it holds every artifact this job resolves; other
      # branches restore it and seldom fetch from Maven Central.
      - id: deps
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches/modules-2
          key: android-deps-lint-${{ hashFiles('client/android/gradle/libs.versions.toml', 'client/android/**/*.gradle.kts') }}
          restore-keys: android-deps-lint-
      - name: Android SDK packages (exact)
        run: |
          # shellcheck disable=SC2086
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install $SDK_PACKAGES < /dev/null
      - name: Lint
        run: ./gradlew --no-daemon --stacktrace --build-cache --parallel :app:lintPlayDebug :app:lintFossDebug
      - name: Save the dependency cache (main only)
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.deps.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches/modules-2
          key: ${{ steps.deps.outputs.cache-primary-key }}

  android-debug:
    name: debug builds
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        working-directory: client/android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: site/.node-version
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: ${{ !(github.event_name == 'push' && github.ref == 'refs/heads/main') }}
      # The Gradle dependency cache. Only a passing job on a push to main
      # saves it, so it holds every artifact this job resolves; other
      # branches restore it and seldom fetch from Maven Central.
      - id: deps
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches/modules-2
          key: android-deps-debug-${{ hashFiles('client/android/gradle/libs.versions.toml', 'client/android/**/*.gradle.kts') }}
          restore-keys: android-deps-debug-
      - name: Android SDK packages (exact)
        run: |
          # shellcheck disable=SC2086
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install $SDK_PACKAGES < /dev/null
      - name: Debug builds
        run: ./gradlew --no-daemon --stacktrace --build-cache --parallel :app:assemblePlayDebug :app:assembleFossDebug
      - name: Upload debug APKs
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-debug-apks
          path: client/android/app/build/outputs/apk/*/debug/*.apk
          retention-days: 7
      - name: Save the dependency cache (main only)
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.deps.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches/modules-2
          key: ${{ steps.deps.outputs.cache-primary-key }}

  android-release:
    name: release builds, release APK check
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        working-directory: client/android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: site/.node-version
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: ${{ !(github.event_name == 'push' && github.ref == 'refs/heads/main') }}
      # The Gradle dependency cache. Only a passing job on a push to main
      # saves it, so it holds every artifact this job resolves; other
      # branches restore it and seldom fetch from Maven Central.
      - id: deps
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches/modules-2
          key: android-deps-release-${{ hashFiles('client/android/gradle/libs.versions.toml', 'client/android/**/*.gradle.kts') }}
          restore-keys: android-deps-release-
      - name: Android SDK packages (exact)
        run: |
          # shellcheck disable=SC2086
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install $SDK_PACKAGES < /dev/null
      - name: Release builds (unsigned, R8)
        run: ./gradlew --daemon --stacktrace --build-cache --parallel :app:assemblePlayRelease :app:assembleFossRelease
      # No test hooks in a release build.
      - name: Release APK check (play, foss)
        run: |
          bash tools/check-release-apk.sh app/build/outputs/apk/play/release/app-play-release-unsigned.apk play
          bash tools/check-release-apk.sh app/build/outputs/apk/foss/release/app-foss-release-unsigned.apk foss
      - name: Foss dependency tree holds no Google Play services or Firebase
        run: |
          ./gradlew --daemon --stacktrace --build-cache --parallel -q :app:dependencies --configuration fossReleaseRuntimeClasspath > "$RUNNER_TEMP/foss-deps.txt"
          if grep -nE 'com\.google\.android\.gms|com\.google\.firebase|credentials-play-services' "$RUNNER_TEMP/foss-deps.txt"; then
            echo "the foss release dependency tree holds the artifacts above"
            exit 1
          fi
      - name: Save the dependency cache (main only)
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.deps.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches/modules-2
          key: ${{ steps.deps.outputs.cache-primary-key }}

  android-bundle:
    name: release bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        working-directory: client/android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: site/.node-version
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: ${{ !(github.event_name == 'push' && github.ref == 'refs/heads/main') }}
      # The Gradle dependency cache. Only a passing job on a push to main
      # saves it, so it holds every artifact this job resolves; other
      # branches restore it and seldom fetch from Maven Central.
      - id: deps
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches/modules-2
          key: android-deps-bundle-${{ hashFiles('client/android/gradle/libs.versions.toml', 'client/android/**/*.gradle.kts') }}
          restore-keys: android-deps-bundle-
      - name: Android SDK packages (exact)
        run: |
          # shellcheck disable=SC2086
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install $SDK_PACKAGES < /dev/null
      - name: Release bundle (play)
        run: ./gradlew --no-daemon --stacktrace --build-cache --parallel :app:bundlePlayRelease
      - name: Save the dependency cache (main only)
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.deps.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches/modules-2
          key: ${{ steps.deps.outputs.cache-primary-key }}
