name: webext

# Chrome extension and Firefox add-on tests. Called by ci.yml and by
# webext-release.yml (the chrome/v* and firefox/v* release jobs);
# workflow_dispatch runs it on any branch by hand. The dev zips are uploaded
# (not for fork PRs or tags).
on:
  workflow_call:
  workflow_dispatch:

permissions: {}

jobs:
  test:
    name: typecheck, tests, builds, web-ext lint
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        working-directory: client/webext-common
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: site/.node-version
      - name: Install
        run: npm ci --ignore-scripts
      - name: No storage.sync under client/
        working-directory: .
        run: |
          if git grep -n 'storage\.sync' -- client/; then
            echo "storage.sync is not allowed (data must stay on the device)"
            exit 1
          fi
      - name: Typecheck
        run: npm run typecheck
      - name: Unit, state machine, manifest and golden vector tests
        run: npm test
      - name: Dev build (both zips)
        run: npm run build -- --dev
      - name: web-ext lint (Firefox build)
        run: npm run lint:firefox
      - name: Upload the dev zips
        if: >-
          !startsWith(github.ref, 'refs/tags/') &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch' ||
          github.event.pull_request.head.repo.full_name == github.repository)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: webext-dev-zips
          path: client/*/dist/pusharmor-*-dev.zip
          retention-days: 7
          if-no-files-found: error
      # Real-browser popup check (I458, I475): headless Firefox opens the real toolbar popup,
      # Chrome loads the popup pages. Fails unless the popup is 400x560 on every open and no
      # tab switch moves the header, tab bar, or content area.
      - name: Popup size and layout (headless Firefox and Chrome)
        run: |
          node build.mjs --dev --shots
          firefox --version
          google-chrome --version
          node popup-check.mjs
      # Proves the release build compiles and passes check-release.mjs. Built
      # with CI dummies, so the zips are thrown away (never uploaded).
      - name: Release build with CI dummies
        run: |
          node ../../release/ci-dummy.mjs
          PA_CI_DUMMY=1 node build.mjs
