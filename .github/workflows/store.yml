name: store

# The store publishing jobs of promote (promote.yml). Started only by
# promote.yml after the owner approval, once per selected platform, by
# workflow_dispatch on that platform's tag <platform>/vX.Y.Z, so each job runs
# on the tag ref that its release Environment allows (tags only). The gate job
# (no Environment, no secret) checks the tag and that an approved promote.yml
# run on main for this version and platform started this run (that run is
# still running or succeeded, and is at most 30 days old), then gives the
# commit of that run: the store job checks it out, so it sends the listing
# files the promote check job checked. Only the job of the tag's platform
# runs. To retry a failed store, rerun this run ("Re-run failed jobs").
# A tag uploads nothing to any store: each job here sends the file of the
# GitHub release <platform>/vX.Y.Z (hash and build attestation checked) right
# before the review submission, and fails with the store and version when an
# earlier version is still in review there.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version X.Y.Z (set by promote.yml)"
        required: true
        type: string
      promote_run:
        description: "Run id of the approved promote run (set by promote.yml)"
        required: true
        type: string

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  VERSION: ${{ inputs.version }}

jobs:
  gate:
    name: tag and approved promote run
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      platform: ${{ steps.gate.outputs.platform }}
      commit: ${{ steps.gate.outputs.commit }}
      play_wif_provider: ${{ steps.gate.outputs.google_play_wif_provider }}
      play_wif_service_account: ${{ steps.gate.outputs.google_play_wif_service_account }}
      cws_wif_provider: ${{ steps.gate.outputs.google_cws_wif_provider }}
      cws_wif_service_account: ${{ steps.gate.outputs.google_cws_wif_service_account }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
          sparse-checkout: |
            /release/
            /site/.node-version
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: site/.node-version
      - id: gate
        name: Tag and approved promote run
        env:
          GH_TOKEN: ${{ github.token }}
          PROMOTE_RUN: ${{ inputs.promote_run }}
        run: node release/promote.mjs gate "$VERSION"

  play:
    name: Google Play production
    needs: gate
    if: needs.gate.outputs.platform == 'android' && startsWith(github.ref, 'refs/tags/android/v')
    # One Play edit at a time: a second promote of android waits.
    concurrency:
      group: play-edit
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: android-release
    permissions:
      contents: write
      id-token: write
      attestations: read
    steps:
      # Hard gate: no Play production release
      # until the owner sets both repository variables to yes: PLAY_CONTACT_OK
      # (public developer contact details in Play Console fixed) and
      # PLAY_PUBLIC_OK (Play may leave internal testing). The promote check job
      # already skips android when either is not yes; this step guards a rerun.
      - name: Play contact details and public release allowed
        env:
          PLAY_CONTACT_OK: ${{ vars.PLAY_CONTACT_OK }}
          PLAY_PUBLIC_OK: ${{ vars.PLAY_PUBLIC_OK }}
        run: |
          if [ "$PLAY_CONTACT_OK" != "yes" ] || [ "$PLAY_PUBLIC_OK" != "yes" ]; then
            echo "Play: BLOCKED. Set the repository variables PLAY_CONTACT_OK and PLAY_PUBLIC_OK to yes (contact details fixed in Play Console; Play may leave internal testing)." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.gate.outputs.commit }}
          persist-credentials: false
          sparse-checkout: |
            /release/
            /store/
            /site/.node-version
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: site/.node-version
      - id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ needs.gate.outputs.play_wif_provider }}
          service_account: ${{ needs.gate.outputs.play_wif_service_account }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher
          create_credentials_file: false
      - id: promote
        name: Upload the AAB of the release and send it to production
        env:
          TOKEN: ${{ steps.auth.outputs.access_token }}
          GH_TOKEN: ${{ github.token }}
          PLAY_CONTACT_OK: ${{ vars.PLAY_CONTACT_OK }}
          PLAY_PUBLIC_OK: ${{ vars.PLAY_PUBLIC_OK }}
        run: node release/promote.mjs play "$VERSION"
      # after the store accepted the build, the release
      # is no longer a test build. Runs only when the step above promoted X.Y.Z
      # now or found X.Y.Z live or in review; never after a SKIP. A
      # release that is already a full release is not an error.
      - name: Clear the GitHub prerelease flag
        if: steps.promote.outputs.clear_prerelease == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "android/v$VERSION" --repo "$GITHUB_REPOSITORY" --prerelease=false

  appstore:
    name: App Store review
    needs: gate
    if: needs.gate.outputs.platform == 'ios' && startsWith(github.ref, 'refs/tags/ios/v')
    # macOS for xcrun altool (the IPA upload); then up to 40 minutes while
    # App Store Connect processes the build.
    runs-on: macos-26
    timeout-minutes: 75
    environment: ios-release
    permissions:
      contents: write
      attestations: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.gate.outputs.commit }}
          persist-credentials: false
          sparse-checkout: |
            /release/
            /store/
            /site/.node-version
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: site/.node-version
      # Fails when another version is in review; else the IPA of the release
      # (hash and build attestation checked) when App Store Connect does not
      # have build X.Y.Z yet.
      - id: ipa
        name: Review check and the IPA of the release
        env:
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          GH_TOKEN: ${{ github.token }}
          IPA_DIR: ${{ runner.temp }}
        run: node release/promote.mjs appstore-upload "$VERSION"
      - name: Upload the IPA to App Store Connect
        if: steps.ipa.outputs.ipa != ''
        env:
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          IPA: ${{ steps.ipa.outputs.ipa }}
        run: |
          umask 077
          mkdir -p "$RUNNER_TEMP/asc"
          printf '%s\n' "$ASC_API_KEY_P8" > "$RUNNER_TEMP/asc/AuthKey_$ASC_API_KEY_ID.p8"
          grep -q 'BEGIN PRIVATE KEY' "$RUNNER_TEMP/asc/AuthKey_$ASC_API_KEY_ID.p8"
          API_PRIVATE_KEYS_DIR="$RUNNER_TEMP/asc" xcrun altool --upload-app -f "$IPA" -t ios \
            --apiKey "$ASC_API_KEY_ID" --apiIssuer "$ASC_API_ISSUER_ID"
      - name: Remove the API key
        if: always()
        run: rm -rf "$RUNNER_TEMP/asc"
      - id: promote
        name: Submit for App Review
        env:
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
        run: node release/promote.mjs appstore "$VERSION"
      # after the store accepted the build, the release
      # is no longer a test build. Runs only when the step above promoted X.Y.Z
      # now or found X.Y.Z live or in review; never after a SKIP. A
      # release that is already a full release is not an error.
      - name: Clear the GitHub prerelease flag
        if: steps.promote.outputs.clear_prerelease == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "ios/v$VERSION" --repo "$GITHUB_REPOSITORY" --prerelease=false

  chrome:
    name: Chrome Web Store public item
    needs: gate
    if: needs.gate.outputs.platform == 'chrome' && startsWith(github.ref, 'refs/tags/chrome/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: chrome-release
    permissions:
      contents: write
      id-token: write
      attestations: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.gate.outputs.commit }}
          persist-credentials: false
          sparse-checkout: |
            /release/
            /store/
            /site/.node-version
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: site/.node-version
      - id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ needs.gate.outputs.cws_wif_provider }}
          service_account: ${{ needs.gate.outputs.cws_wif_service_account }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/chromewebstore
          create_credentials_file: false
      - id: promote
        name: Upload and publish the public zip
        env:
          TOKEN: ${{ steps.auth.outputs.access_token }}
          GH_TOKEN: ${{ github.token }}
        run: node release/promote.mjs chrome "$VERSION"
      # after the store accepted the build, the release
      # is no longer a test build. Runs only when the step above promoted X.Y.Z
      # now or found X.Y.Z live or in review; never after a SKIP. A
      # release that is already a full release is not an error.
      - name: Clear the GitHub prerelease flag
        if: steps.promote.outputs.clear_prerelease == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "chrome/v$VERSION" --repo "$GITHUB_REPOSITORY" --prerelease=false

  firefox:
    name: Firefox AMO listed add-on
    needs: gate
    if: needs.gate.outputs.platform == 'firefox' && startsWith(github.ref, 'refs/tags/firefox/v')
    runs-on: ubuntu-24.04
    # This file is read from the tag commit, so a tag made before a change
    # here runs with the old limit (firefox/v0.0.28 has 20 minutes).
    timeout-minutes: 60
    environment: firefox-release
    permissions:
      contents: write
      attestations: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.gate.outputs.commit }}
          persist-credentials: false
          sparse-checkout: |
            /release/
            /store/
            /site/.node-version
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: site/.node-version
      - id: promote
        name: Submit the public zip as a listed version
        env:
          MOZILLA_AMO_JWT_ISSUER: ${{ secrets.MOZILLA_AMO_JWT_ISSUER }}
          MOZILLA_AMO_JWT_SECRET: ${{ secrets.MOZILLA_AMO_JWT_SECRET }}
          GH_TOKEN: ${{ github.token }}
        run: node release/promote.mjs firefox "$VERSION"
      # after the store accepted the build, the release
      # is no longer a test build. Runs only when the step above promoted X.Y.Z
      # now or found X.Y.Z live or in review; never after a SKIP. A
      # release that is already a full release is not an error.
      - name: Clear the GitHub prerelease flag
        if: steps.promote.outputs.clear_prerelease == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "firefox/v$VERSION" --repo "$GITHUB_REPOSITORY" --prerelease=false
