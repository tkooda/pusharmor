name: repo

# Whole-repo checks, called by ci.yml on every run.
on:
  workflow_call:

permissions: {}

env:
  ACTIONLINT_VERSION: 1.7.12
  ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  ascii:
    name: ASCII only
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Every tracked text file is ASCII (binary files are skipped)
        run: |
          if git grep -I -n -P '[^\x00-\x7F]'; then
            echo "non-ASCII characters in the files above"
            exit 1
          fi

  workflows:
    name: actionlint and banned triggers
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: No privileged triggers in .github/
        run: |
          # the pattern is split so this file does not match itself
          pat='pull_request''_target|workflow''_run'
          if git grep -n -E "$pat" -- .github/; then
            echo "these triggers run with secrets on untrusted code and are not allowed"
            exit 1
          fi
      - name: Install actionlint (pinned, SHA-256 checked)
        run: |
          d="$RUNNER_TEMP/actionlint"
          mkdir -p "$d"
          f="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o "$d/$f" "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/$f"
          echo "$ACTIONLINT_SHA256  $d/$f" | sha256sum -c -
          tar -xzf "$d/$f" -C "$d" actionlint
      - name: actionlint (shellcheck from the runner image)
        run: '"$RUNNER_TEMP/actionlint/actionlint" -color'

  gitleaks:
    name: gitleaks secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install gitleaks (pinned, SHA-256 checked)
        run: |
          d="$RUNNER_TEMP/gitleaks"
          mkdir -p "$d"
          f="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$d/$f" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$f"
          echo "$GITLEAKS_SHA256  $d/$f" | sha256sum -c -
          tar -xzf "$d/$f" -C "$d" gitleaks
      - name: Scan the full git history
        run: '"$RUNNER_TEMP/gitleaks/gitleaks" git --config .gitleaks.toml --redact --no-banner --verbose .'

  release-scripts:
    name: release/ scripts
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: site/.node-version
      - name: names, public ids, CI dummies, tag rule
        run: node --test release/*.test.mjs

  dependency-review:
    name: dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
