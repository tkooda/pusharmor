name: ios

# iOS tests and builds. Called by ci.yml on a push (the per-change gate: Core
# tests, builds and the app unit tests, newest simulator runtime only) and by
# ios-release.yml with release: true (only what a push does not run: the UI
# tests and the iOS 17 job; the gate jobs already passed in ci on the tag
# commit). The UI tests build once (build-for-testing) and run in three shards.
# nightly.yml calls it with release: true on main when main changed since the
# last nightly run; a manual dispatch runs every job. The Debug simulator app
# is uploaded (not for tags).
on:
  workflow_call:
    inputs:
      release:
        description: run only the UI tests and the iOS 17 job (the release run)
        type: boolean
        default: false
  workflow_dispatch:

permissions: {}

env:
  XCODE_APP: /Applications/Xcode_26.6.app
  XCODE_VERSION: "Xcode 26.6"
  XCODE_BUILD: "Build version 17F113"
  XCODEGEN_VERSION: 2.46.0
  XCODEGEN_SHA256: 4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806
  SIM_NAME: iPhone 17
  OLDEST_IOS: "17.5"
  OLDEST_DEVICE: iPhone 15

jobs:
  ios-core-test:
    name: PushArmorCore tests (macOS and simulator)
    if: ${{ !inputs.release }}
    runs-on: macos-26
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select and assert Xcode
        run: |
          echo "runner image: $ImageOS $ImageVersion"
          sudo xcode-select -s "$XCODE_APP"
          v="$(xcodebuild -version)"
          echo "$v"
          printf '%s\n' "$v" | grep -qx "$XCODE_VERSION"
          printf '%s\n' "$v" | grep -qx "$XCODE_BUILD"
      - name: swift test (macOS host)
        run: swift test --package-path client/ios/PushArmorCore
      - name: Simulator present
        run: |
          xcrun simctl list runtimes
          xcrun simctl list runtimes | grep -q '^iOS 26\.' || { echo "no iOS 26 simulator runtime"; exit 1; }
          xcrun simctl list devices available | grep -qF "    $SIM_NAME (" || { echo "no $SIM_NAME simulator"; exit 1; }
      - name: xcodebuild test (iOS simulator)
        working-directory: client/ios/PushArmorCore
        run: xcodebuild test -scheme PushArmorCore -destination "platform=iOS Simulator,name=$SIM_NAME,OS=latest"

  ios-build:
    name: Debug simulator and Release device builds (unsigned)
    if: ${{ !inputs.release }}
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: site/.node-version
      - name: Select and assert Xcode
        run: |
          echo "runner image: $ImageOS $ImageVersion"
          sudo xcode-select -s "$XCODE_APP"
          v="$(xcodebuild -version)"
          echo "$v"
          printf '%s\n' "$v" | grep -qx "$XCODE_VERSION"
          printf '%s\n' "$v" | grep -qx "$XCODE_BUILD"
      - name: Config/Public.xcconfig from release/public.json
        run: sh client/ios/tools/public-xcconfig.sh
      - name: XcodeGen (pinned, SHA-256 checked) and generate the project
        run: |
          d="$RUNNER_TEMP/xcodegen"
          mkdir -p "$d"
          curl -fsSL -o "$d/xcodegen.zip" "https://github.com/yonaskolb/XcodeGen/releases/download/$XCODEGEN_VERSION/xcodegen.zip"
          echo "$XCODEGEN_SHA256  $d/xcodegen.zip" | shasum -a 256 -c -
          unzip -q "$d/xcodegen.zip" -d "$d"
          "$d/xcodegen/bin/xcodegen" --version | grep -qF "$XCODEGEN_VERSION"
          cd client/ios && "$d/xcodegen/bin/xcodegen" generate
      - name: Resolve packages to the committed pins
        working-directory: client/ios
        run: |
          s=PushArmor.xcodeproj/project.xcworkspace/xcshareddata/swiftpm
          mkdir -p "$s"
          cp PushArmorCore/Package.resolved "$s/Package.resolved"
          xcodebuild -resolvePackageDependencies -project PushArmor.xcodeproj -scheme PushArmor
          python3 -I -c '
          import json, sys
          pins = lambda p: sorted((x["identity"], x["state"].get("revision")) for x in json.load(open(p))["pins"])
          if pins(sys.argv[1]) != pins(sys.argv[2]):
              sys.exit("resolved packages differ from PushArmorCore/Package.resolved")
          ' PushArmorCore/Package.resolved "$s/Package.resolved"
      - name: Debug build (simulator)
        working-directory: client/ios
        run: >-
          xcodebuild build -project PushArmor.xcodeproj -scheme PushArmor -configuration Debug
          -destination "generic/platform=iOS Simulator" -derivedDataPath "$RUNNER_TEMP/dd"
          -disableAutomaticPackageResolution CODE_SIGNING_ALLOWED=NO
      - name: Zip the Debug simulator app
        run: ditto -c -k --keepParent "$RUNNER_TEMP/dd/Build/Products/Debug-iphonesimulator/PushArmor.app" "$RUNNER_TEMP/PushArmor-simulator.zip"
      - name: Upload the Debug simulator app
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-debug-simulator-app
          path: ${{ runner.temp }}/PushArmor-simulator.zip
          retention-days: 7
          if-no-files-found: error
      - name: Release build (device, unsigned; runs the release values gate)
        working-directory: client/ios
        run: >-
          xcodebuild build -project PushArmor.xcodeproj -scheme PushArmor -configuration Release
          -destination "generic/platform=iOS" -derivedDataPath "$RUNNER_TEMP/dd"
          -disableAutomaticPackageResolution CODE_SIGNING_ALLOWED=NO
      # No test hooks in a release build.
      - name: Release bundle check
        run: bash client/ios/tools/check-release-bundle.sh "$RUNNER_TEMP/dd/Build/Products/Release-iphoneos/PushArmor.app"
      # Manual dispatch only (before a release tag): the archive line of
      # ios-release.yml build-ios (ad-hoc signed, no secrets) and its checks.
      - name: Release archive as in ios-release.yml, groups and bundle check
        if: github.event_name == 'workflow_dispatch'
        working-directory: client/ios
        run: |
          TEAM="$(node -p 'require(process.argv[1]).apple_team_id' "$GITHUB_WORKSPACE/release/public.json")"
          bash tools/release-archive.sh "$RUNNER_TEMP/PushArmor.xcarchive" "$TEAM" 0.0.0 1
          bash tools/check-release-bundle.sh "$RUNNER_TEMP/PushArmor.xcarchive"

  # The per-change app tests: the whole PushArmorTests target.
  ios-sim-test:
    name: app unit tests (newest simulator)
    if: ${{ !inputs.release }}
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select and assert Xcode
        run: |
          echo "runner image: $ImageOS $ImageVersion"
          sudo xcode-select -s "$XCODE_APP"
          v="$(xcodebuild -version)"
          echo "$v"
          printf '%s\n' "$v" | grep -qx "$XCODE_VERSION"
          printf '%s\n' "$v" | grep -qx "$XCODE_BUILD"
      - name: XcodeGen (pinned, SHA-256 checked) and generate the project
        run: |
          d="$RUNNER_TEMP/xcodegen"
          mkdir -p "$d"
          curl -fsSL -o "$d/xcodegen.zip" "https://github.com/yonaskolb/XcodeGen/releases/download/$XCODEGEN_VERSION/xcodegen.zip"
          echo "$XCODEGEN_SHA256  $d/xcodegen.zip" | shasum -a 256 -c -
          unzip -q "$d/xcodegen.zip" -d "$d"
          "$d/xcodegen/bin/xcodegen" --version | grep -qF "$XCODEGEN_VERSION"
          cd client/ios && "$d/xcodegen/bin/xcodegen" generate
      - name: Resolve packages to the committed pins
        working-directory: client/ios
        run: |
          s=PushArmor.xcodeproj/project.xcworkspace/xcshareddata/swiftpm
          mkdir -p "$s"
          cp PushArmorCore/Package.resolved "$s/Package.resolved"
          xcodebuild -resolvePackageDependencies -project PushArmor.xcodeproj -scheme PushArmor
          python3 -I -c '
          import json, sys
          pins = lambda p: sorted((x["identity"], x["state"].get("revision")) for x in json.load(open(p))["pins"])
          if pins(sys.argv[1]) != pins(sys.argv[2]):
              sys.exit("resolved packages differ from PushArmorCore/Package.resolved")
          ' PushArmorCore/Package.resolved "$s/Package.resolved"
      - name: Simulator present
        run: |
          xcrun simctl list runtimes | grep -q '^iOS 26\.' || { echo "no iOS 26 simulator runtime"; exit 1; }
          xcrun simctl list devices available | grep -qF "    $SIM_NAME (" || { echo "no $SIM_NAME simulator"; exit 1; }
      # DerivedData with the built Swift packages, written only by a push to
      # main; other branches read it. The app sources are rebuilt (fresh mtimes).
      - name: Restore DerivedData
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/dd
          key: ios-unit-dd-${{ hashFiles('.github/workflows/ios.yml', 'client/ios/PushArmorCore/Package.resolved', 'client/ios/project.yml') }}
      # Scheme test action: PushArmorTests + PushArmorUITests; this job runs the unit tests.
      - name: xcodebuild test (PushArmor scheme, PushArmorTests)
        working-directory: client/ios
        run: |
          xcodebuild test -project PushArmor.xcodeproj -scheme PushArmor \
            -destination "platform=iOS Simulator,name=$SIM_NAME,OS=latest" \
            -disableAutomaticPackageResolution -only-testing:PushArmorTests \
            -derivedDataPath "$RUNNER_TEMP/dd" -resultBundlePath "$RUNNER_TEMP/PushArmor.xcresult"
      - name: Save DerivedData (push to main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/dd
          key: ios-unit-dd-${{ hashFiles('.github/workflows/ios.yml', 'client/ios/PushArmorCore/Package.resolved', 'client/ios/project.yml') }}
      - name: Upload the result bundle
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-sim-test-xcresult-unit
          path: ${{ runner.temp }}/PushArmor.xcresult
          retention-days: 7

  # Release, nightly and manual runs: build the app and its tests once for the
  # UI shards below.
  ios-build-for-testing:
    name: build for testing (newest simulator)
    if: inputs.release || github.event_name == 'workflow_dispatch'
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select and assert Xcode
        run: |
          echo "runner image: $ImageOS $ImageVersion"
          sudo xcode-select -s "$XCODE_APP"
          v="$(xcodebuild -version)"
          echo "$v"
          printf '%s\n' "$v" | grep -qx "$XCODE_VERSION"
          printf '%s\n' "$v" | grep -qx "$XCODE_BUILD"
      - name: XcodeGen (pinned, SHA-256 checked) and generate the project
        run: |
          d="$RUNNER_TEMP/xcodegen"
          mkdir -p "$d"
          curl -fsSL -o "$d/xcodegen.zip" "https://github.com/yonaskolb/XcodeGen/releases/download/$XCODEGEN_VERSION/xcodegen.zip"
          echo "$XCODEGEN_SHA256  $d/xcodegen.zip" | shasum -a 256 -c -
          unzip -q "$d/xcodegen.zip" -d "$d"
          "$d/xcodegen/bin/xcodegen" --version | grep -qF "$XCODEGEN_VERSION"
          cd client/ios && "$d/xcodegen/bin/xcodegen" generate
      - name: Resolve packages to the committed pins
        working-directory: client/ios
        run: |
          s=PushArmor.xcodeproj/project.xcworkspace/xcshareddata/swiftpm
          mkdir -p "$s"
          cp PushArmorCore/Package.resolved "$s/Package.resolved"
          xcodebuild -resolvePackageDependencies -project PushArmor.xcodeproj -scheme PushArmor
          python3 -I -c '
          import json, sys
          pins = lambda p: sorted((x["identity"], x["state"].get("revision")) for x in json.load(open(p))["pins"])
          if pins(sys.argv[1]) != pins(sys.argv[2]):
              sys.exit("resolved packages differ from PushArmorCore/Package.resolved")
          ' PushArmorCore/Package.resolved "$s/Package.resolved"
      - name: Simulator present
        run: |
          xcrun simctl list runtimes | grep -q '^iOS 26\.' || { echo "no iOS 26 simulator runtime"; exit 1; }
          xcrun simctl list devices available | grep -qF "    $SIM_NAME (" || { echo "no $SIM_NAME simulator"; exit 1; }
      - name: xcodebuild build-for-testing (PushArmor scheme)
        working-directory: client/ios
        run: |
          xcodebuild build-for-testing -project PushArmor.xcodeproj -scheme PushArmor \
            -destination "platform=iOS Simulator,name=$SIM_NAME,OS=latest" \
            -disableAutomaticPackageResolution -derivedDataPath "$RUNNER_TEMP/dd"
      # tar keeps the file modes and symlinks of the app bundles.
      - name: Pack the test products
        run: tar -C "$RUNNER_TEMP/dd/Build" -czf "$RUNNER_TEMP/ios-test-products.tar.gz" Products
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-test-products
          path: ${{ runner.temp }}/ios-test-products.tar.gz
          retention-days: 1
          if-no-files-found: error

  # The UI tests in three shards of about equal time, with the products of
  # ios-build-for-testing. The last two shards skip what the others name, so a
  # new test class or BrandScreensTests method is never missed.
  ios-ui-test:
    name: UI tests (newest simulator, ${{ matrix.shard }})
    needs: ios-build-for-testing
    runs-on: macos-26
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: brand-1
            filter: >-
              -only-testing:PushArmorUITests/BrandScreensTests/testSendButtonNamesTheSelectedPeer
              -only-testing:PushArmorUITests/BrandScreensTests/testSendAsTextSharesTheHintRow
              -only-testing:PushArmorUITests/BrandScreensTests/testSendBannerSitsAboveTheTabBar
              -only-testing:PushArmorUITests/BrandScreensTests/testHistoryIsItsOwnTab
              -only-testing:PushArmorUITests/BrandScreensTests/testPairingCardShowsTheFingerprintCells
              -only-testing:PushArmorUITests/BrandScreensTests/testUnpairedPeerActionsHaveAVisibleButton
              -only-testing:PushArmorUITests/BrandScreensTests/testPairHowToAndRenameInSettings
              -only-testing:PushArmorUITests/BrandScreensTests/testRenameIsInline
              -only-testing:PushArmorUITests/BrandScreensTests/testContentSwitchAndAccountRow
          - shard: brand-2
            filter: >-
              -only-testing:PushArmorUITests/BrandScreensTests
              -skip-testing:PushArmorUITests/BrandScreensTests/testSendButtonNamesTheSelectedPeer
              -skip-testing:PushArmorUITests/BrandScreensTests/testSendAsTextSharesTheHintRow
              -skip-testing:PushArmorUITests/BrandScreensTests/testSendBannerSitsAboveTheTabBar
              -skip-testing:PushArmorUITests/BrandScreensTests/testHistoryIsItsOwnTab
              -skip-testing:PushArmorUITests/BrandScreensTests/testPairingCardShowsTheFingerprintCells
              -skip-testing:PushArmorUITests/BrandScreensTests/testUnpairedPeerActionsHaveAVisibleButton
              -skip-testing:PushArmorUITests/BrandScreensTests/testPairHowToAndRenameInSettings
              -skip-testing:PushArmorUITests/BrandScreensTests/testRenameIsInline
              -skip-testing:PushArmorUITests/BrandScreensTests/testContentSwitchAndAccountRow
          - shard: rest
            filter: -only-testing:PushArmorUITests -skip-testing:PushArmorUITests/BrandScreensTests
    permissions: {}
    steps:
      - name: Select and assert Xcode
        run: |
          echo "runner image: $ImageOS $ImageVersion"
          sudo xcode-select -s "$XCODE_APP"
          v="$(xcodebuild -version)"
          echo "$v"
          printf '%s\n' "$v" | grep -qx "$XCODE_VERSION"
          printf '%s\n' "$v" | grep -qx "$XCODE_BUILD"
      - name: Simulator present
        run: |
          xcrun simctl list runtimes | grep -q '^iOS 26\.' || { echo "no iOS 26 simulator runtime"; exit 1; }
          xcrun simctl list devices available | grep -qF "    $SIM_NAME (" || { echo "no $SIM_NAME simulator"; exit 1; }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ios-test-products
          path: ${{ runner.temp }}
      - name: Unpack the test products
        run: |
          mkdir -p "$RUNNER_TEMP/dd"
          tar -C "$RUNNER_TEMP/dd" -xzf "$RUNNER_TEMP/ios-test-products.tar.gz"
      - name: xcodebuild test-without-building (${{ matrix.shard }})
        env:
          FILTER: ${{ matrix.filter }}
        run: |
          set -- "$RUNNER_TEMP"/dd/Products/*.xctestrun
          [ "$#" = 1 ] && [ -f "$1" ] || { echo "want one .xctestrun file, found: $*"; exit 1; }
          # shellcheck disable=SC2086
          xcodebuild test-without-building -xctestrun "$1" \
            -destination "platform=iOS Simulator,name=$SIM_NAME,OS=latest" \
            $FILTER -resultBundlePath "$RUNNER_TEMP/PushArmor.xcresult"
      - name: Upload the result bundle
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-ui-test-xcresult-${{ matrix.shard }}
          path: ${{ runner.temp }}/PushArmor.xcresult
          retention-days: 7

  # iOS 17 (the deployment target). macos-26 images ship no iOS 17 runtime, so
  # the job downloads it first (several GB).
  ios-sim-test-oldest:
    name: core and app tests (iOS 17 simulator)
    if: inputs.release || github.event_name == 'workflow_dispatch'
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select and assert Xcode
        run: |
          echo "runner image: $ImageOS $ImageVersion"
          sudo xcode-select -s "$XCODE_APP"
          v="$(xcodebuild -version)"
          echo "$v"
          printf '%s\n' "$v" | grep -qx "$XCODE_VERSION"
          printf '%s\n' "$v" | grep -qx "$XCODE_BUILD"
      - name: iOS 17 runtime and simulator device
        id: sim
        run: |
          # A fresh runner may not have CoreSimulatorService up yet; the download
          # then fails with "Unable to connect to simulator" (exit 70). Start the
          # service first and retry the download.
          xcrun simctl list runtimes > /dev/null
          for i in 1 2 3; do
            xcodebuild -downloadPlatform iOS -buildVersion "$OLDEST_IOS" && break
            [ "$i" = 3 ] && exit 1
            echo "download failed (attempt $i); restarting the simulator service"
            sudo killall -9 com.apple.CoreSimulator.CoreSimulatorService 2>/dev/null || true
            sleep 20
            xcrun simctl list runtimes > /dev/null
          done
          rt="$(xcrun simctl list runtimes -j | python3 -I -c '
          import json, sys
          want = sys.argv[1]
          ids = [r["identifier"] for r in json.load(sys.stdin)["runtimes"]
                 if r.get("platform") == "iOS" and r.get("isAvailable") and (r["version"] == want or r["version"].startswith(want + "."))]
          print(ids[0] if ids else "")
          ' "$OLDEST_IOS")"
          [ -n "$rt" ] || { echo "no available iOS $OLDEST_IOS runtime"; xcrun simctl list runtimes; exit 1; }
          udid="$(xcrun simctl create "PushArmor iOS $OLDEST_IOS" "$OLDEST_DEVICE" "$rt")"
          echo "runtime $rt, device $udid"
          echo "dest=platform=iOS Simulator,id=$udid" >> "$GITHUB_OUTPUT"
      - name: XcodeGen (pinned, SHA-256 checked) and generate the project
        run: |
          d="$RUNNER_TEMP/xcodegen"
          mkdir -p "$d"
          curl -fsSL -o "$d/xcodegen.zip" "https://github.com/yonaskolb/XcodeGen/releases/download/$XCODEGEN_VERSION/xcodegen.zip"
          echo "$XCODEGEN_SHA256  $d/xcodegen.zip" | shasum -a 256 -c -
          unzip -q "$d/xcodegen.zip" -d "$d"
          "$d/xcodegen/bin/xcodegen" --version | grep -qF "$XCODEGEN_VERSION"
          cd client/ios && "$d/xcodegen/bin/xcodegen" generate
      - name: Resolve packages to the committed pins
        working-directory: client/ios
        run: |
          s=PushArmor.xcodeproj/project.xcworkspace/xcshareddata/swiftpm
          mkdir -p "$s"
          cp PushArmorCore/Package.resolved "$s/Package.resolved"
          xcodebuild -resolvePackageDependencies -project PushArmor.xcodeproj -scheme PushArmor
          python3 -I -c '
          import json, sys
          pins = lambda p: sorted((x["identity"], x["state"].get("revision")) for x in json.load(open(p))["pins"])
          if pins(sys.argv[1]) != pins(sys.argv[2]):
              sys.exit("resolved packages differ from PushArmorCore/Package.resolved")
          ' PushArmorCore/Package.resolved "$s/Package.resolved"
      - name: xcodebuild test (PushArmorCore)
        working-directory: client/ios/PushArmorCore
        env:
          DEST: ${{ steps.sim.outputs.dest }}
        run: xcodebuild test -scheme PushArmorCore -destination "$DEST" -resultBundlePath "$RUNNER_TEMP/PushArmorCore-oldest.xcresult"
      - name: xcodebuild test (PushArmor scheme)
        working-directory: client/ios
        env:
          DEST: ${{ steps.sim.outputs.dest }}
        run: >-
          xcodebuild test -project PushArmor.xcodeproj -scheme PushArmor
          -destination "$DEST" -disableAutomaticPackageResolution
          -resultBundlePath "$RUNNER_TEMP/PushArmor-oldest.xcresult"
      - name: Upload the result bundles
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-sim-test-oldest-xcresult
          path: ${{ runner.temp }}/*.xcresult
          retention-days: 7
          if-no-files-found: ignore
