version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directories:
      - /server/worker
      - /client/webext-common
      - /client/webext-common/amo-sign
      - /site
    schedule:
      interval: weekly
  # A Gradle bump needs the dependency verification metadata regenerated on the
  # Dependabot branch before merge: ./gradlew --write-verification-metadata sha256 help
  - package-ecosystem: gradle
    directory: /client/android
    schedule:
      interval: weekly
  - package-ecosystem: swift
    directory: /client/ios/PushArmorCore
    schedule:
      interval: weekly
  # Hash-pinned test and build tools of the command-line client.
  - package-ecosystem: pip
    directory: /client/cli
    schedule:
      interval: weekly
